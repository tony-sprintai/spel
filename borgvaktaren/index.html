<!doctype html>

<head>

<meta charset="utf-8">

<title>Borgväktaren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;800&family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: fullskärms-3D med HUD i kanterna, byggring vid byggplatsen och menyer som mittpaneler. Ett fast mörkt tema. */
:root{
  --navy:#16213f; --navy-2:#223062; --panel:rgba(18,26,56,.88);
  --gold:#f6c445; --gold-dk:#b9831c; --blue:#3b7cf0; --red:#e0473c; --purple:#9b6bff;
  --leaf:#4cae4f; --paper:#fff7e6; --muted:#b9c3e6; --parch:#f1dfb4; --ink:#4a3418;
  --f-title:"Grenze Gotisch","Times New Roman",serif;
  --f-ui:"Lilita One","Arial Black",Impact,system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#8fcbe9;margin:0;}
body{color:var(--paper);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
#app{position:fixed;inset:0;overflow:hidden;}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding:0;}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--f-ui);}
#hud .top{position:absolute;left:0;right:0;top:0;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:7px;}
.iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:14px;background:var(--panel);display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.35);flex:none;font-family:var(--f-ui);font-size:18px;}
.iconbtn svg{width:22px;height:22px;fill:var(--paper);}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.pill{flex:1;min-width:0;height:36px;border-radius:18px;background:rgba(10,14,30,.72);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 2px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:4px;font-size:clamp(14px,4.6vw,18px);overflow:hidden;text-shadow:0 2px 0 rgba(0,0,0,.55);font-variant-numeric:tabular-nums;white-space:nowrap;}
.pill svg{width:18px;height:18px;flex:none;}
#hpPill svg{fill:#ff7a6b}
#wavePill svg{fill:#ffb0a8}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f6c445 45%,#c98c12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);flex:none;display:inline-block;}
.pop{animation:pop .28s ease-out;}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
#hud .bottom{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));display:flex;align-items:flex-end;gap:10px;}
#speedBtn{width:56px;height:56px;border-radius:18px;font-size:20px;}
#speedBtn.on{background:linear-gradient(#7fb2ff,#2f62d6);}
#waveBtn{pointer-events:auto;flex:1;min-width:0;height:64px;border-radius:20px;font-family:var(--f-ui);font-size:22px;background:linear-gradient(#ff8a6b,#d0392a);color:#fff;box-shadow:0 5px 0 #8f2219,0 8px 14px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transition:transform .08s;}
#waveBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #8f2219;}
#waveBtn small{font-size:15px;color:#ffe08a;}
#waveBtn[disabled]{background:rgba(18,26,56,.8);box-shadow:0 3px 0 rgba(0,0,0,.35);color:var(--muted);pointer-events:none;}
#waveBtn.pulse{animation:wpulse 1.1s ease-in-out infinite;}
@keyframes wpulse{50%{transform:scale(1.05)}}
#rainBtn{pointer-events:auto;position:relative;width:72px;height:72px;border-radius:22px;background:linear-gradient(#ffd866,#e4a420);box-shadow:0 5px 0 var(--gold-dk),0 8px 14px rgba(0,0,0,.35);display:grid;place-items:center;flex:none;overflow:hidden;}
#rainBtn svg{width:42px;height:42px;fill:#5a3a06;position:relative;}
#rainBtn .cd{position:absolute;inset:0;background:conic-gradient(rgba(10,14,30,.72) var(--p,0%),transparent 0);}
#rainBtn .cdt{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6);}
#rainBtn.aim{background:linear-gradient(#ff8a6b,#d0392a);box-shadow:0 5px 0 #8f2219,0 0 0 4px #fff;}
#rainBtn.cool{pointer-events:none;}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:var(--panel);padding:10px 16px;border-radius:14px;font-family:var(--f-body);font-weight:800;font-size:15px;white-space:nowrap;animation:bob 1.2s ease-in-out infinite;box-shadow:0 0 0 2px rgba(246,196,69,.6);}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
#flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(224,40,30,0);transition:box-shadow .25s;}
#flash.on{box-shadow:inset 0 0 120px 30px rgba(224,40,30,.6);transition:none;}
#floats,#coins{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.ft{position:absolute;left:0;top:0;font-family:var(--f-ui);font-size:22px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45);white-space:nowrap;will-change:transform,opacity;}
.ft.bad{color:#ffb0a8;font-size:26px}.ft.gold{color:#ffe08a;font-size:24px}
.cf{position:absolute;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--f-ui);font-size:46px;text-shadow:0 4px 0 rgba(0,0,0,.45);pointer-events:none;opacity:0;}
#banner.show{animation:banner 1.8s ease-out forwards;}
#banner small{display:block;font-size:20px;color:var(--gold);}
@keyframes banner{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#fps{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 58px);font:12px/1 ui-monospace,monospace;background:rgba(0,0,0,.5);padding:4px 6px;border-radius:6px;}

/* ---------- byggring ---------- */
#ring{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;font-family:var(--f-ui);}
.opt{pointer-events:auto;position:absolute;left:0;top:0;width:58px;height:58px;border-radius:50%;transform:translate(calc(var(--x) - 50%),calc(var(--y) - 50%));background:radial-gradient(circle at 40% 30%,#4569c8,#223062 70%);box-shadow:0 0 0 3px var(--gold),0 5px 0 rgba(0,0,0,.4);display:grid;place-items:center;animation:optin .18s ease-out backwards;}
@keyframes optin{from{opacity:0}}
.opt svg{animation:svgin .2s ease-out backwards;}
@keyframes svgin{from{transform:scale(.4)}}
.opt svg{width:30px;height:30px;fill:var(--paper);}
.opt b{position:absolute;left:50%;top:100%;transform:translate(-50%,-6px);background:#1b1408;border-radius:9px;padding:1px 7px 2px;font-weight:400;font-size:15px;color:#ffe08a;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.4);}
.opt.poor{filter:grayscale(.85) brightness(.75);}
.opt.poor b{color:#ff9a8a;}
.opt.pick{background:radial-gradient(circle at 40% 30%,#7ad66a,#2f7d33 70%);box-shadow:0 0 0 3px #fff,0 5px 0 rgba(0,0,0,.4);}
.opt.sell{background:radial-gradient(circle at 40% 30%,#d9534a,#7a1d16 70%);}
.opt.sell.pick{background:radial-gradient(circle at 40% 30%,#ff8a6b,#c0392b 70%);}
.opt.max{filter:grayscale(.6);pointer-events:none;}
.tip{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 96px));width:max-content;max-width:min(300px,86vw);background:var(--panel);border-radius:14px;padding:8px 12px;text-align:center;box-shadow:0 0 0 2px rgba(246,196,69,.55),0 6px 14px rgba(0,0,0,.35);}
.tip.below{transform:translate(-50%,96px);}
.tip h4{margin:0;font-weight:400;font-size:18px;}
.tip p{margin:2px 0 0;font-family:var(--f-body);font-weight:800;font-size:13px;color:var(--muted);}
.tip p.go{color:#bfe3a8;}

/* ---------- skärmar ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));overflow-y:auto;}
.screen>.panel{margin:auto 0;flex:none;}
.scrim{justify-content:flex-start;background:linear-gradient(rgba(12,18,40,.2),rgba(12,18,40,.6));}
.panel{width:100%;max-width:400px;background:var(--panel);border-radius:26px;padding:20px 16px;box-shadow:0 0 0 3px rgba(246,196,69,.55),0 18px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px;align-items:stretch;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.panel h2{margin:0;text-align:center;font-family:var(--f-ui);font-weight:400;font-size:32px;text-wrap:balance;}
.btn{font-family:var(--f-ui);font-size:23px;padding:13px 18px;border-radius:18px;background:linear-gradient(#ffd866,#eaa922);color:#3f2700;box-shadow:0 6px 0 var(--gold-dk),0 10px 18px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s;display:flex;align-items:center;justify-content:center;gap:10px;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-dk);}
.btn.green{background:linear-gradient(#7ad66a,#3f9c3a);color:#fff;box-shadow:0 6px 0 #2a6b27,0 10px 18px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.3);}
.btn.green:active{box-shadow:0 2px 0 #2a6b27;}
.btn.ghost{background:var(--panel);color:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.35);font-size:19px;padding:11px 14px;}
.btn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.35);}
.btn[disabled]{filter:grayscale(.9) brightness(.75);pointer-events:none;}
.row{display:flex;gap:10px;}
.row>*{flex:1;min-width:0;}
.starpill{align-self:center;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border-radius:999px;padding:6px 14px 6px 10px;font-family:var(--f-ui);font-size:21px;font-variant-numeric:tabular-nums;}
.star{width:22px;height:22px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:linear-gradient(#fff2a6,#f6c445 50%,#d8961a);flex:none;display:inline-block;}

#start{justify-content:space-between;}
.titleblock{margin-top:5vh;text-align:center;filter:drop-shadow(0 6px 0 rgba(20,20,50,.35));}
.titleblock h1{margin:0;font-family:var(--f-title);font-weight:800;font-size:clamp(54px,16vw,96px);line-height:.9;color:var(--paper);-webkit-text-stroke:2px #3a2508;text-shadow:0 4px 0 #3a2508,0 8px 0 rgba(0,0,0,.25);}
.titleblock h1 span{display:block;color:var(--gold);}
.titleblock p{margin:14px auto 0;max-width:30ch;font-weight:800;font-size:16px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.65);text-wrap:balance;}
.startmenu{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;margin-bottom:2vh;}
.startmenu .btn.green{font-size:30px;padding:17px;}

/* karta */
.mapwrap{position:relative;width:100%;aspect-ratio:300/430;max-height:58vh;margin:0 auto;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#f7e8c3,#e3c98f 75%,#c9a866);box-shadow:inset 0 0 0 3px #9b7a3e,inset 0 0 30px rgba(110,70,20,.45);}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;}
.node{cursor:pointer;}
.node circle.b{fill:#2f6be0;stroke:#fff7e6;stroke-width:3;}
.node.done circle.b{fill:#3f9c3a;}
.node.lock circle.b{fill:#8b7d63;stroke:#6b5d43;}
.node circle.ring{fill:transparent;stroke:none;}
.node.sel circle.ring{stroke:#e0473c;stroke-width:4;}
.node text.n{font-family:var(--f-ui);font-size:19px;fill:#fff;text-anchor:middle;dominant-baseline:central;}
.node text.s{font-size:11px;fill:#b07a10;text-anchor:middle;font-family:var(--f-ui);letter-spacing:1px;}
.mapcard{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border-radius:16px;padding:10px 12px;}
.mapcard .info{flex:1;min-width:0;}
.mapcard h3{margin:0;font-family:var(--f-ui);font-weight:400;font-size:21px;}
.mapcard p{margin:2px 0 0;font-size:13px;color:var(--muted);}
.mapcard .btn{font-size:20px;padding:10px 16px;flex:none;}
.sts{display:inline-flex;gap:2px;vertical-align:-2px;margin-left:4px;}
.sts i{width:14px;height:14px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:rgba(255,255,255,.2);}
.sts i.on{background:var(--gold);}

/* resultat */
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0 2px;}
.stars i{width:64px;height:64px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:rgba(255,255,255,.14);transform:scale(.6);transition:transform .3s cubic-bezier(.3,1.8,.5,1),background .2s;}
.stars i:nth-child(2){width:78px;height:78px;margin-top:-12px;}
.stars i.on{background:linear-gradient(#fff2a6,#f6c445 50%,#d8961a);transform:scale(1);}
.reslines{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:16px;color:var(--muted);text-align:center;text-wrap:balance;}

/* förbättringar */
.cards{display:flex;flex-direction:column;gap:7px;}
.card{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:16px;padding:7px 9px;}
.card .ic{width:40px;height:40px;border-radius:14px;background:var(--navy-2);display:grid;place-items:center;flex:none;}
.card .ic svg{width:24px;height:24px;fill:var(--gold);}
.card .info{flex:1;min-width:0;}
.card h3{margin:0;font-family:var(--f-ui);font-weight:400;font-size:19px;}
.card p{margin:0 0 3px;font-size:12px;line-height:1.25;color:var(--muted);}
.pips{display:flex;gap:3px;}
.pips i{flex:1;max-width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);}
.pips i.on{background:var(--gold);}
.card .val{font-size:12.5px;font-weight:900;margin-top:3px;color:#cfe0ff;}
.buy{font-family:var(--f-ui);font-size:18px;min-width:70px;padding:10px 8px;border-radius:14px;background:linear-gradient(#7ad66a,#3f9c3a);box-shadow:0 4px 0 #2a6b27;display:flex;align-items:center;justify-content:center;gap:5px;color:#fff;flex:none;}
.buy .star{width:17px;height:17px;}
.buy:active{transform:translateY(3px);box-shadow:0 1px 0 #2a6b27;}
.buy[disabled]{background:rgba(255,255,255,.12);box-shadow:none;color:var(--muted);pointer-events:none;}
.tiny{font-size:12px;color:var(--muted);text-align:center;margin:0;}
@media (prefers-reduced-motion:reduce){#hint,#waveBtn.pulse,.pop,.opt{animation:none}}
/* ---------- v2: nästa våg, fiendekort, karta med riken, statistik ---------- */
#preview{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 60px);display:flex;justify-content:center;pointer-events:none;padding:0 60px;}
#preview .box{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(10,14,30,.72);border-radius:14px;padding:4px 8px;font-family:var(--f-ui);font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.25);}
#preview .lbl{color:var(--muted);font-size:13px;}
.chip{display:inline-flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums;}
.eic{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--c,#555);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);flex:none;}
.eic svg{width:16px;height:16px;fill:#fff;}
.eic.big{width:84px;height:84px;margin:0 auto;box-shadow:0 0 0 4px rgba(255,255,255,.25),inset 0 -5px 0 rgba(0,0,0,.25);}
.eic.big svg{width:54px;height:54px;}
.ecard{text-align:center;display:flex;flex-direction:column;gap:8px;}
.ecard .tag{font-family:var(--f-ui);color:var(--gold);font-size:16px;letter-spacing:.5px;}
.ecard p{margin:0;font-weight:800;font-size:16px;color:#e6ecff;text-wrap:balance;}
.ecard .facts{display:flex;justify-content:center;gap:10px;font-size:13px;color:var(--muted);font-weight:800;flex-wrap:wrap;}
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.3);padding:4px;border-radius:16px;}
.tabs button{flex:1;font-family:var(--f-ui);font-size:17px;padding:8px 6px;border-radius:12px;color:var(--muted);}
.tabs button.on{background:var(--navy-2);color:var(--paper);box-shadow:0 2px 0 rgba(0,0,0,.35);}
.tabs button[disabled]{opacity:.45;}
.mapwrap.snow{background:radial-gradient(ellipse at 50% 40%,#f4f8fb,#d6e4ee 75%,#b4c6d4);box-shadow:inset 0 0 0 3px #7d93a6,inset 0 0 30px rgba(40,70,110,.35);}
.modes{display:flex;gap:8px;}
.modes .btn{flex:1;font-size:16px;padding:9px 6px;flex-direction:column;gap:0;line-height:1.1;}
.modes .btn small{font-family:var(--f-body);font-size:11.5px;font-weight:800;opacity:.85;}
.btn.red{background:linear-gradient(#ff8a6b,#c0392b);color:#fff;box-shadow:0 5px 0 #7a1d16,0 8px 14px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.3);}
.btn.purple{background:linear-gradient(#a98bff,#6a3fc0);color:#fff;box-shadow:0 5px 0 #3f2380,0 8px 14px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.3);}
.stats{display:flex;flex-direction:column;gap:5px;background:rgba(0,0,0,.25);border-radius:14px;padding:9px 11px;}
.stats .srow{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;}
.stats .srow span:first-child{flex:0 0 92px;color:var(--muted);}
.stats .bar{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;}
.stats .bar i{display:block;height:100%;background:linear-gradient(90deg,#f6c445,#ff8a6b);border-radius:5px;}
.stats .srow b{flex:0 0 46px;text-align:right;font-variant-numeric:tabular-nums;}
.stats .sum{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#cfe0ff;font-weight:800;border-top:1px solid rgba(255,255,255,.12);padding-top:6px;margin-top:2px;flex-wrap:wrap;}
.ft.crit{color:#fff2a6;font-size:20px;}
.ft.info{color:#cfe0ff;font-size:18px;}
.opt.br{background:radial-gradient(circle at 40% 30%,#b58cff,#5b2fb0 70%);}
.opt.br.pick{background:radial-gradient(circle at 40% 30%,#d9c2ff,#7d4fe0 70%);}
.opt.rally{background:radial-gradient(circle at 40% 30%,#5fc4ff,#1f6db8 70%);}
.opt.lock{filter:grayscale(1) brightness(.6);}
.tip{transform:translate(-50%,calc(-100% - 116px));}
.tip.below{transform:translate(-50%,136px);}
.card{padding:6px 9px;}
.card .ic{width:36px;height:36px;}
#upgScr .panel{max-width:420px;}

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import * as M from './modell.js';
const { G, LV, S, FX, TT, TYPES, ET, LEVELS, NL, REALMS, UPG, UPG_KEYS, STEP, ROAD_W, CASTLE_Z, pathAt, _pa, minPathDist, price, upgVal, rainStats, starsTotal, starsFree, rng, clamp, TAU } = M;

/* ================= Grund ================= */
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
Object.assign(G, {tut:2, crenelsDown:0, collapse:0, shake:0, speed:1});

/* ================= Sparning ================= */
// Ny nyckel borgvaktaren.v2. Finns den inte läses borgvaktaren.v1 och flyttas över. v1-nyckeln skrivs aldrig.
S.save = M.loadSaveFrom(k => { try{ return localStorage.getItem(k); }catch(e){ return null; } });
function persist(){ try{ localStorage.setItem(M.SAVE_KEY, JSON.stringify(S.save)); }catch(e){} }
if(S.save.migrated){ delete S.save.migrated; persist(); }

/* fiendeikoner (används i nästa våg och på fiendekorten) */
const EICON = {

  runner:'<circle cx="14.5" cy="4.5" r="2.3"/><path d="M9 8.5l4.5-1.2 3 3 3.3.9-.6 2-4.2-1.1-1.3 3 3 3.4-1.4 1.6-4-3.6-2 4.5H7l3.2-7.6-2.4 1-1.6-1.8z"/>',
  shield:'<path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/>',
  ram:'<path d="M2 9.5h13l5-2.5v9l-5-2.5H2z"/><circle cx="5" cy="17.5" r="2.3"/><circle cx="12" cy="17.5" r="2.3"/>',
  boss:'<path d="M3 19 2 7.5l5 4 5-7 5 7 5-4L21 19z"/>',
  gargoyle:'<circle cx="12" cy="9.5" r="2.8"/><path d="M1 7.5c3.5 0 6.5 1.4 8.4 4.4L8.6 17C6.7 14 4.4 12.2 1 12zM23 7.5c-3.5 0-6.5 1.4-8.4 4.4l.8 5.1c1.9-3 4.2-4.8 7.6-5z"/>',
  shaman:'<path d="M5 2h2.2v20H5zM13.5 8h3V5h2.2v3h3v2.2h-3v3h-2.2v-3h-3z"/>',
  sapper:'<circle cx="10" cy="14.5" r="7"/><path d="M14 7.5l3-3.2 2.2 1.2-3 3.2z"/><path d="M19.6 2.2l1.2 1.8-1.8 1-1-1.8z" fill="#ffd24a"/>',
  troll:'<path d="M5 9.5a7 7 0 0 1 14 0v4l2.2 6.5H2.8L5 13.5z"/><path d="M8 2.5l2 3.5M16 2.5l-2 3.5" stroke="#fff" stroke-width="2"/>',
};
const eic = (t, big) => `<span class="eic${big?' big':''}" style="--c:${ET[t].css}"><svg viewBox="0 0 24 24">${EICON[t]||''}</svg></span>`;

/* ================= Ljud (WebAudio-syntes) ================= */
const Snd = {
  ctx:null, master:null, nb:null, last:{},
  init(){
    try{
      if(!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
        this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
        const n = this.ctx.sampleRate*.5|0; this.nb = this.ctx.createBuffer(1,n,this.ctx.sampleRate);
        const d = this.nb.getChannelData(0); for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
      }
      this.master.gain.value = S.save.mute ? 0 : .5;
      if(this.ctx.state === 'suspended') this.ctx.resume();
    }catch(e){}
  },
  ok(key, gap){ if(!this.ctx || S.save.mute || G.mode==='attract') return false; const t = this.ctx.currentTime; if(key && this.last[key] && t-this.last[key]<gap) return false; if(key) this.last[key] = t; return true; },
  tone(f,d,type='square',v=.2,f2=null,delay=0){
    const c=this.ctx, t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+d+.02);
  },
  noise(d,v,freq,delay=0,q=1){
    const c=this.ctx, t=c.currentTime+delay, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.nb; f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random()*.3); s.stop(t+d+.02);
  },
  arrow(){ if(!this.ok('arrow',.06)) return; this.noise(.06,.12,3200,0,2); this.tone(rand(700,800),.06,'triangle',.06,300); },
  thud(){ if(!this.ok('thud',.1)) return; this.tone(140,.18,'sine',.3,60); this.noise(.12,.2,500); },
  boom(){ if(!this.ok('boom',.12)) return; this.noise(.45,.4,240); this.tone(80,.4,'sine',.4,35); },
  zap(){ if(!this.ok('zap',.08)) return; this.tone(1300,.16,'sine',.09,280); this.tone(660,.1,'square',.03,990); },
  clash(){ if(!this.ok('clash',.09)) return; this.noise(.05,.12,rand(2600,4200),0,3); this.tone(rand(900,1300),.035,'square',.03); },
  die(){ if(!this.ok('die',.07)) return; this.tone(rand(280,340),.09,'square',.05,110); },
  build(){ if(!this.ok('build',.1)) return; [0,.09,.18].forEach(d=>{ this.noise(.06,.3,900,d,2); this.tone(220,.05,'square',.06,null,d); }); },
  sell(){ if(!this.ok('sell',.1)) return; [1320,990,660].forEach((f,i)=>this.tone(f,.08,'square',.06,null,i*.06)); },
  coin(){ if(!this.ok('coin',.06)) return; this.tone(1320,.06,'square',.05); this.tone(1760,.1,'square',.05,null,.05); },
  hurt(){ if(!this.ok('hurt',.15)) return; this.tone(170,.3,'sawtooth',.18,70); this.noise(.2,.25,500); },
  horn(){ if(!this.ok('horn',.5)) return; this.tone(196,.45,'sawtooth',.08,185); this.tone(147,.45,'sawtooth',.06,140); this.tone(98,.5,'sine',.15); },
  rain(){ if(!this.ok('rain',.5)) return; this.noise(1.1,.22,2400,0,.6); for(let i=0;i<10;i++) this.tone(rand(500,900),.05,'triangle',.04,200,.3+i*.06); },
  click(){ if(!this.ok('click',.03)) return; this.tone(880,.05,'square',.06,660); },
  win(){ if(!this.ok()) return; [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.26,'square',.11,null,i*.11)); },
  lose(){ if(!this.ok()) return; [392,330,262,196].forEach((f,i)=>this.tone(f,.32,'triangle',.18,null,i*.17)); },
  star(i){ if(!this.ok()) return; this.tone(784*Math.pow(1.26,i),.18,'square',.09); },
  cannon(){ if(!this.ok('cannon',.12)) return; this.noise(.3,.45,180); this.tone(90,.3,'sine',.45,40); this.noise(.06,.2,2400,0,1); },
  frost(){ if(!this.ok('frost',.08)) return; this.tone(1800,.18,'sine',.06,2600); this.tone(2400,.12,'triangle',.04,1600,.04); },
  bolt(){ if(!this.ok('bolt',.1)) return; this.noise(.18,.3,3000,0,.8); this.tone(220,.12,'sawtooth',.08,90); },
  pop(){ if(!this.ok('pop',.05)) return; this.noise(.12,.18,700,0,1.4); },
  heal(){ if(!this.ok('heal',.4)) return; [660,880,990].forEach((f,i)=>this.tone(f,.12,'sine',.03,null,i*.05)); },
  card(){ if(!this.ok('card',.3)) return; [392,523,659].forEach((f,i)=>this.tone(f,.18,'triangle',.08,null,i*.08)); },
  rally(){ if(!this.ok('rally',.1)) return; this.tone(523,.08,'square',.05); this.tone(784,.12,'square',.05,null,.07); },
};
function setMute(m){
  S.save.mute = m; persist(); Snd.init();
  document.querySelectorAll('.sndon').forEach(p => p.style.display = m ? 'none' : '');
  document.querySelectorAll('.sndoff').forEach(p => p.style.display = m ? '' : 'none');
}
/* ---------- Musik: en liten medeltida slinga i d-moll, syntetiserad. Trummor när en våg pågår. ---------- */
const Music = {
  gain:null, timer:null, next:0, step:0,
  CH:[[50,53,57],[48,52,55],[46,50,53],[45,49,52]],
  mtof(n){ return 440*Math.pow(2,(n-69)/12); },
  start(){
    if(!Snd.ctx || this.timer) return;
    try{
      this.gain = Snd.ctx.createGain(); this.gain.gain.value = 0; this.gain.connect(Snd.master);
      this.next = Snd.ctx.currentTime + .15;
      this.timer = setInterval(()=>this.tick(), 90);
      this.apply();
    }catch(e){}
  },
  apply(){
    if(this.gain) this.gain.gain.setTargetAtTime(S.save.music ? 1 : 0, Snd.ctx.currentTime, .25);
    document.querySelectorAll('.musoff').forEach(p => p.style.display = S.save.music ? 'none' : '');
    const b = $('musicBtn'); if(b) b.textContent = 'Musik: ' + (S.save.music ? 'på' : 'av');
  },
  osc(f, t, d, type, v){
    const c = Snd.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    o.connect(g); g.connect(this.gain); o.start(t); o.stop(t+d+.05);
  },
  drum(t, f, d, v){
    const c = Snd.ctx, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = Snd.nb; fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = 1.2;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    s.connect(fl); fl.connect(g); g.connect(this.gain); s.start(t, Math.random()*.3); s.stop(t+d+.05);
  },
  tick(){
    const c = Snd.ctx; if(!c || c.state!=='running') return;
    const e8 = 60/104/2;
    if(this.next < c.currentTime) this.next = c.currentTime + .05;
    while(this.next < c.currentTime + .3){ this.note(this.step, this.next); this.step++; this.next += e8; }
  },
  note(s, t){
    if(!S.save.music || S.save.mute) return;
    const bar = (s>>3) % 4, e = s % 8, ch = this.CH[bar];
    const battle = G.mode==='play' && !G.waveReady && !G.over;
    if(e===0) this.osc(this.mtof(ch[0]-12), t, 1.7, 'triangle', .09);
    if(e===4) this.osc(this.mtof(ch[0]-5), t, .8, 'triangle', .05);
    const pat = [0,1,2,1,0,2,1,2], hi = (s>>5)%2 ? 12 : 0;
    if(battle || e%2===0) this.osc(this.mtof(ch[pat[e]]+12+(e===6?hi:0)), t, .26, 'triangle', .035);
    if((s%64)===56 || (s%64)===60) this.osc(this.mtof(ch[2]+24), t, .5, 'sine', .025);
    if(battle){ if(e===0 || e===3 || e===4) this.drum(t, 160, .22, .2); if(e%2===1) this.drum(t, 5200, .05, .04); }
  },
};
function setMusic(on){ S.save.music = on; persist(); Snd.init(); Music.start(); Music.apply(); }

/* ================= Renderare och scen ================= */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
let pixelRatio = Math.min(window.devicePixelRatio||1, 2);
renderer.setPixelRatio(pixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const SKY = 0x8fcbe9;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 60, 120);
const camera = new THREE.PerspectiveCamera(40, 1, .5, 300);
scene.add(new THREE.HemisphereLight(0xe4f3ff, 0x5d7d3a, 1.25));
const sun = new THREE.DirectionalLight(0xfff0d2, 2.3);
sun.position.set(-12, 30, 8); sun.target.position.set(0,0,-1);
sun.castShadow = true;
const isSmall = Math.min(innerWidth, innerHeight) < 600;
sun.shadow.mapSize.set(isSmall?1024:2048, isSmall?1024:2048);
Object.assign(sun.shadow.camera, {left:-16, right:16, top:24, bottom:-24, near:1, far:80});
sun.shadow.bias = -.0006; sun.shadow.normalBias = .03;
scene.add(sun, sun.target);

/* ---------- geometri-hjälp ---------- */
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _v2 = new THREE.Vector3(), _s = new THREE.Vector3(1,1,1), _one = new THREE.Vector3(1,1,1), ZAX = new THREE.Vector3(0,0,1);
function part(geo, color, x=0,y=0,z=0, rx=0,ry=0,rz=0, sx=1,sy=1,sz=1){
  let g = geo.index ? geo.toNonIndexed() : geo;
  if(g.attributes.uv) g.deleteAttribute('uv');
  _m4.compose(_v.set(x,y,z), _q.setFromEuler(_e.set(rx,ry,rz)), new THREE.Vector3(sx,sy,sz));
  g.applyMatrix4(_m4);
  const c = new THREE.Color(color), n = g.attributes.position.count, a = new Float32Array(n*3);
  for(let i=0;i<n;i++){ a[i*3]=c.r; a[i*3+1]=c.g; a[i*3+2]=c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(a,3));
  return g;
}
function merge(parts){
  let tot = 0; for(const p of parts) tot += p.attributes.position.count;
  const pos = new Float32Array(tot*3), nor = new Float32Array(tot*3), col = new Float32Array(tot*3);
  let o = 0;
  for(const p of parts){ pos.set(p.attributes.position.array,o*3); nor.set(p.attributes.normal.array,o*3); col.set(p.attributes.color.array,o*3); o += p.attributes.position.count; p.dispose(); }

let last = performance.now(), fAcc = 0, fN = 0, slowAcc = 0, slowN = 0, acc = 0;
const DT = .02;
function simulate(dt){
  if(G.mode!=='play' && G.mode!=='attract'){ acc = 0; return; }
  acc += dt * (G.mode==='play' ? G.speed : 1);
  let n = 0;
  while(acc >= DT && n < 12){ M.update(DT); acc -= DT; n++; if(G.mode!=='play' && G.mode!=='attract'){ acc = 0; break; } }
  if(n >= 12) acc = 0;
}
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now;
  if(dt > .05) dt = .05;
  simulate(dt);
  if(G.mode==='after' && G.collapse>0) G.collapse += dt;
  else if(G.collapse>0 && (G.mode==='play')) G.collapse += dt;
  drawAll(G.mode==='pause'||G.mode==='card' ? 0 : dt);
  updateParticles(G.mode==='pause'||G.mode==='card' ? 0 : dt);
  updateFloats(dt);
  updateCamera(dt);
  if(G.mode==='play') hudTick();
  renderer.render(scene, camera);
  fAcc += dt; fN++;
  if(fAcc >= .5){
    const fps = fN/fAcc; window.__fps = fps;
    if(showFps) fpsEl.textContent = `${fps.toFixed(0)} fps · ${G.enemies.length} fiender · dpr ${pixelRatio}`;
    fAcc = 0; fN = 0;
    if(G.mode==='play'){ slowAcc += fps; slowN++; if(slowN>=4){ const avg = slowAcc/slowN; slowAcc=0; slowN=0; if(avg<45 && pixelRatio>1.25){ pixelRatio = Math.max(1.25, pixelRatio-.25); renderer.setPixelRatio(pixelRatio); fitCamera(); } } }
  }
}
