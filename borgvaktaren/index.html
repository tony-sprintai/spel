<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16213f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Borgväktaren">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="icon" type="image/png" href="ikon-192.png">
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<title>Borgväktaren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;800&family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: fullskärms-3D med HUD i kanterna, byggring vid byggplatsen och menyer som mittpaneler. Ett fast mörkt tema. */
:root{
  --navy:#16213f; --navy-2:#223062; --panel:rgba(18,26,56,.88);
  --gold:#f6c445; --gold-dk:#b9831c; --blue:#3b7cf0; --red:#e0473c; --purple:#9b6bff;
  --leaf:#4cae4f; --paper:#fff7e6; --muted:#b9c3e6; --parch:#f1dfb4; --ink:#4a3418;
  --f-title:"Grenze Gotisch","Times New Roman",serif;
  --f-ui:"Lilita One","Arial Black",Impact,system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#8fcbe9;margin:0;}
body{color:var(--paper);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
#app{position:fixed;inset:0;overflow:hidden;}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding:0;}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--f-ui);}
#hud .top{position:absolute;left:0;right:0;top:0;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:7px;}
.iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:14px;background:var(--panel);display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.35);flex:none;font-family:var(--f-ui);font-size:18px;}
.iconbtn svg{width:22px;height:22px;fill:var(--paper);}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.pill{flex:1;min-width:0;height:36px;border-radius:18px;background:rgba(10,14,30,.72);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 2px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:4px;font-size:clamp(14px,4.6vw,18px);overflow:hidden;text-shadow:0 2px 0 rgba(0,0,0,.55);font-variant-numeric:tabular-nums;white-space:nowrap;}
.pill svg{width:18px;height:18px;flex:none;}
#hpPill svg{fill:#ff7a6b}
#wavePill svg{fill:#ffb0a8}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f6c445 45%,#c98c12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);flex:none;display:inline-block;}
.pop{animation:pop .28s ease-out;}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
#hud .bottom{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));display:flex;align-items:flex-end;gap:10px;}
#speedBtn{width:56px;height:56px;border-radius:18px;font-size:20px;}
#speedBtn.on{background:linear-gradient(#7fb2ff,#2f62d6);}
#waveBtn{pointer-events:auto;flex:1;min-width:0;height:64px;border-radius:20px;font-family:var(--f-ui);font-size:22px;background:linear-gradient(#ff8a6b,#d0392a);color:#fff;box-shadow:0 5px 0 #8f2219,0 8px 14px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transition:transform .08s;}
#waveBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #8f2219;}
#waveBtn small{font-size:15px;color:#ffe08a;}
#waveBtn[disabled]{background:rgba(18,26,56,.8);box-shadow:0 3px 0 rgba(0,0,0,.35);color:var(--muted);pointer-events:none;}
#waveBtn.pulse{animation:wpulse 1.1s ease-in-out infinite;}
@keyframes wpulse{50%{transform:scale(1.05)}}
#rainBtn{pointer-events:auto;position:relative;width:72px;height:72px;border-radius:22px;background:linear-gradient(#ffd866,#e4a420);box-shadow:0 5px 0 var(--gold-dk),0 8px 14px rgba(0,0,0,.35);display:grid;place-items:center;flex:none;overflow:hidden;}
#rainBtn svg{width:42px;height:42px;fill:#5a3a06;position:relative;}
#rainBtn .cd{position:absolute;inset:0;background:conic-gradient(rgba(10,14,30,.72) var(--p,0%),transparent 0);}
#rainBtn .cdt{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6);}
#rainBtn.aim{background:linear-gradient(#ff8a6b,#d0392a);box-shadow:0 5px 0 #8f2219,0 0 0 4px #fff;}
#rainBtn.cool{pointer-events:none;}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:var(--panel);padding:10px 16px;border-radius:14px;font-family:var(--f-body);font-weight:800;font-size:15px;white-space:nowrap;animation:bob 1.2s ease-in-out infinite;box-shadow:0 0 0 2px rgba(246,196,69,.6);}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
#flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(224,40,30,0);transition:box-shadow .25s;}
#flash.on{box-shadow:inset 0 0 120px 30px rgba(224,40,30,.6);transition:none;}
#floats,#coins{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.ft{position:absolute;left:0;top:0;font-family:var(--f-ui);font-size:22px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45);white-space:nowrap;will-change:transform,opacity;}
.ft.bad{color:#ffb0a8;font-size:26px}.ft.gold{color:#ffe08a;font-size:24px}
.cf{position:absolute;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--f-ui);font-size:46px;text-shadow:0 4px 0 rgba(0,0,0,.45);pointer-events:none;opacity:0;}
#banner.show{animation:banner 1.8s ease-out forwards;}
#banner small{display:block;font-size:20px;color:var(--gold);}
@keyframes banner{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#fps{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 58px);font:12px/1 ui-monospace,monospace;background:rgba(0,0,0,.5);padding:4px 6px;border-radius:6px;}

/* ---------- byggring ---------- */
#ring{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;font-family:var(--f-ui);}
.opt{pointer-events:auto;position:absolute;left:0;top:0;width:58px;height:58px;border-radius:50%;transform:translate(calc(var(--x) - 50%),calc(var(--y) - 50%));background:radial-gradient(circle at 40% 30%,#4569c8,#223062 70%);box-shadow:0 0 0 3px var(--gold),0 5px 0 rgba(0,0,0,.4);display:grid;place-items:center;animation:optin .18s ease-out backwards;}
@keyframes optin{from{opacity:0}}
.opt svg{animation:svgin .2s ease-out backwards;}
@keyframes svgin{from{transform:scale(.4)}}
.opt svg{width:30px;height:30px;fill:var(--paper);}
.opt b{position:absolute;left:50%;top:100%;transform:translate(-50%,-6px);background:#1b1408;border-radius:9px;padding:1px 7px 2px;font-weight:400;font-size:15px;color:#ffe08a;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.4);}
.opt.poor{filter:grayscale(.85) brightness(.75);}
.opt.poor b{color:#ff9a8a;}
.opt.pick{background:radial-gradient(circle at 40% 30%,#7ad66a,#2f7d33 70%);box-shadow:0 0 0 3px #fff,0 5px 0 rgba(0,0,0,.4);}
.opt.sell{background:radial-gradient(circle at 40% 30%,#d9534a,#7a1d16 70%);}
.opt.sell.pick{background:radial-gradient(circle at 40% 30%,#ff8a6b,#c0392b 70%);}
.opt.max{filter:grayscale(.6);pointer-events:none;}
.tip{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 96px));width:max-content;max-width:min(300px,86vw);background:var(--panel);border-radius:14px;padding:8px 12px;text-align:center;box-shadow:0 0 0 2px rgba(246,196,69,.55),0 6px 14px rgba(0,0,0,.35);}
.tip.below{transform:translate(-50%,96px);}
.tip h4{margin:0;font-weight:400;font-size:18px;}
.tip p{margin:2px 0 0;font-family:var(--f-body);font-weight:800;font-size:13px;color:var(--muted);}
.tip p.go{color:#bfe3a8;}

/* ---------- skärmar ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));overflow-y:auto;}
.screen>.panel{margin:auto 0;flex:none;}
.scrim{justify-content:flex-start;background:linear-gradient(rgba(12,18,40,.2),rgba(12,18,40,.6));}
.panel{width:100%;max-width:400px;background:var(--panel);border-radius:26px;padding:20px 16px;box-shadow:0 0 0 3px rgba(246,196,69,.55),0 18px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px;align-items:stretch;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.panel h2{margin:0;text-align:center;font-family:var(--f-ui);font-weight:400;font-size:32px;text-wrap:balance;}
.btn{font-family:var(--f-ui);font-size:23px;padding:13px 18px;border-radius:18px;background:linear-gradient(#ffd866,#eaa922);color:#3f2700;box-shadow:0 6px 0 var(--gold-dk),0 10px 18px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s;display:flex;align-items:center;justify-content:center;gap:10px;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-dk);}
.btn.green{background:linear-gradient(#7ad66a,#3f9c3a);color:#fff;box-shadow:0 6px 0 #2a6b27,0 10px 18px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.3);}
.btn.green:active{box-shadow:0 2px 0 #2a6b27;}
.btn.ghost{background:var(--panel);color:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.35);font-size:19px;padding:11px 14px;}
.btn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.35);}
.btn[disabled]{filter:grayscale(.9) brightness(.75);pointer-events:none;}
.row{display:flex;gap:10px;}
.row>*{flex:1;min-width:0;}
.starpill{align-self:center;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border-radius:999px;padding:6px 14px 6px 10px;font-family:var(--f-ui);font-size:21px;font-variant-numeric:tabular-nums;}
.star{width:22px;height:22px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:linear-gradient(#fff2a6,#f6c445 50%,#d8961a);flex:none;display:inline-block;}

#start{justify-content:space-between;}
.titleblock{margin-top:5vh;text-align:center;filter:drop-shadow(0 6px 0 rgba(20,20,50,.35));}
.titleblock h1{margin:0;font-family:var(--f-title);font-weight:800;font-size:clamp(54px,16vw,96px);line-height:.9;color:var(--paper);-webkit-text-stroke:2px #3a2508;text-shadow:0 4px 0 #3a2508,0 8px 0 rgba(0,0,0,.25);}
.titleblock h1 span{display:block;color:var(--gold);}
.titleblock p{margin:14px auto 0;max-width:30ch;font-weight:800;font-size:16px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.65);text-wrap:balance;}
.startmenu{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;margin-bottom:2vh;}
.startmenu .btn.green{font-size:30px;padding:17px;}

/* karta */
.mapwrap{position:relative;width:100%;aspect-ratio:300/430;max-height:58vh;margin:0 auto;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#f7e8c3,#e3c98f 75%,#c9a866);box-shadow:inset 0 0 0 3px #9b7a3e,inset 0 0 30px rgba(110,70,20,.45);}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;}
.node{cursor:pointer;}
.node circle.b{fill:#2f6be0;stroke:#fff7e6;stroke-width:3;}
.node.done circle.b{fill:#3f9c3a;}
.node.lock circle.b{fill:#8b7d63;stroke:#6b5d43;}
.node circle.ring{fill:transparent;stroke:none;}
.node.sel circle.ring{stroke:#e0473c;stroke-width:4;}
.node text.n{font-family:var(--f-ui);font-size:19px;fill:#fff;text-anchor:middle;dominant-baseline:central;}
.node text.s{font-size:11px;fill:#b07a10;text-anchor:middle;font-family:var(--f-ui);letter-spacing:1px;}
.mapcard{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border-radius:16px;padding:10px 12px;}
.mapcard .info{flex:1;min-width:0;}
.mapcard h3{margin:0;font-family:var(--f-ui);font-weight:400;font-size:21px;}
.mapcard p{margin:2px 0 0;font-size:13px;color:var(--muted);}
.mapcard .btn{font-size:20px;padding:10px 16px;flex:none;}
.sts{display:inline-flex;gap:2px;vertical-align:-2px;margin-left:4px;}
.sts i{width:14px;height:14px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:rgba(255,255,255,.2);}
.sts i.on{background:var(--gold);}

/* resultat */
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0 2px;}
.stars i{width:64px;height:64px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:rgba(255,255,255,.14);transform:scale(.6);transition:transform .3s cubic-bezier(.3,1.8,.5,1),background .2s;}
.stars i:nth-child(2){width:78px;height:78px;margin-top:-12px;}
.stars i.on{background:linear-gradient(#fff2a6,#f6c445 50%,#d8961a);transform:scale(1);}
.reslines{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:16px;color:var(--muted);text-align:center;text-wrap:balance;}

/* förbättringar */
.cards{display:flex;flex-direction:column;gap:7px;}
.card{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:16px;padding:7px 9px;}
.card .ic{width:40px;height:40px;border-radius:14px;background:var(--navy-2);display:grid;place-items:center;flex:none;}
.card .ic svg{width:24px;height:24px;fill:var(--gold);}
.card .info{flex:1;min-width:0;}
.card h3{margin:0;font-family:var(--f-ui);font-weight:400;font-size:19px;}
.card p{margin:0 0 3px;font-size:12px;line-height:1.25;color:var(--muted);}
.pips{display:flex;gap:3px;}
.pips i{flex:1;max-width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);}
.pips i.on{background:var(--gold);}
.card .val{font-size:12.5px;font-weight:900;margin-top:3px;color:#cfe0ff;}
.buy{font-family:var(--f-ui);font-size:18px;min-width:70px;padding:10px 8px;border-radius:14px;background:linear-gradient(#7ad66a,#3f9c3a);box-shadow:0 4px 0 #2a6b27;display:flex;align-items:center;justify-content:center;gap:5px;color:#fff;flex:none;}
.buy .star{width:17px;height:17px;}
.buy:active{transform:translateY(3px);box-shadow:0 1px 0 #2a6b27;}
.buy[disabled]{background:rgba(255,255,255,.12);box-shadow:none;color:var(--muted);pointer-events:none;}
.tiny{font-size:12px;color:var(--muted);text-align:center;margin:0;}
@media (prefers-reduced-motion:reduce){#hint,#waveBtn.pulse,.pop,.opt{animation:none}}
</style>

<div id="app">
  <canvas id="c"></canvas>

  <div id="hud" hidden>
    <div class="top" id="hudTop">
      <button class="iconbtn" id="pauseBtn" aria-label="Paus"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
      <div class="pill" id="hpPill" aria-label="Borgens liv"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg><span id="hpN">20</span></div>
      <div class="pill" id="goldPill" aria-label="Guld"><i class="coin"></i><span id="goldN">0</span></div>
      <div class="pill" id="wavePill" aria-label="Våg"><svg viewBox="0 0 24 24"><path d="M5 2h2v20H5zM8 3h11l-3 4.5L19 12H8z"/></svg><span id="waveN">0/8</span></div>
      <button class="iconbtn sndbtn" aria-label="Ljud av eller på"><svg viewBox="0 0 24 24"><path class="sndon" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff7e6" stroke-width="2" fill="none"/><path class="sndoff" d="M16 9l6 6M22 9l-6 6" stroke="#ff8a7a" stroke-width="2.4" fill="none"/><path d="M4 9h4l5-4v14l-5-4H4z"/></svg></button>
    </div>
    <div id="hint" hidden></div>
    <div class="bottom">
      <button class="iconbtn" id="speedBtn" aria-label="Dubbel fart">×1</button>
      <button id="waveBtn"><span id="waveTxt">Starta våg 1</span><small id="waveSub"></small></button>
      <button id="rainBtn" aria-label="Regn av pilar"><svg viewBox="0 0 24 24"><path d="M5 2h1.6v9.5l1.4-1.6v2.5L5.8 15 3.6 12.4V9.9L5 11.5zM11.2 5h1.6v9.5l1.4-1.6v2.5L12 18l-2.2-2.6v-2.5l1.4 1.6zM17.4 2H19v9.5l1.4-1.6v2.5L18.2 15 16 12.4V9.9l1.4 1.6z"/><path d="M2 20.5h20V22H2z"/></svg><i class="cd"></i><span class="cdt" id="rainCd"></span></button>
    </div>
  </div>
  <div id="ring" hidden></div>
  <div id="floats"></div>
  <div id="coins"></div>
  <div id="flash"></div>
  <div id="banner"></div>
  <div id="fps" hidden></div>

  <div class="screen" id="start">
    <div class="titleblock">
      <h1>Borg<span>väktaren</span></h1>
      <p>Bygg torn längs vägen och håll fienden borta från borgporten.</p>
    </div>
    <div class="startmenu">
      <div class="starpill"><i class="star"></i><span class="starN">0</span></div>
      <button class="btn green" id="playBtn">Spela</button>
      <div class="row">
        <button class="btn ghost" id="mapBtn">Karta</button>
        <button class="btn ghost" id="upgBtn1">Förbättra</button>
        <button class="btn ghost sndbtn" style="flex:0 0 56px" aria-label="Ljud av eller på"><svg viewBox="0 0 24 24" width="22" height="22" fill="#fff7e6"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="sndon" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff7e6" stroke-width="2" fill="none"/><path class="sndoff" d="M16 9l6 6M22 9l-6 6" stroke="#ff8a7a" stroke-width="2.4" fill="none"/></svg></button>
      </div>
    </div>
  </div>

  <div class="screen scrim" id="mapScr" hidden>
    <div class="panel">
      <h2>Riket</h2>
      <div class="mapwrap"><svg id="mapSvg" viewBox="0 0 300 430"></svg></div>
      <div class="mapcard"><div class="info"><h3 id="mcName">Bana 1</h3><p id="mcSub"></p></div><button class="btn green" id="mcPlay">Spela</button></div>
      <button class="btn ghost" id="mapBack">Tillbaka</button>
    </div>
  </div>

  <div class="screen scrim" id="upgScr" hidden>
    <div class="panel">
      <h2>Kungens råd</h2>
      <div class="starpill"><i class="star"></i><span id="starFree">0</span>&nbsp;att använda</div>
      <div class="cards" id="upgList"></div>
      <div class="row">
        <button class="btn ghost" id="upgBack" style="flex:0 0 auto">Tillbaka</button>
        <button class="btn green" id="upgPlay">Spela</button>
      </div>

    curve.getTangentAt(u,_v2); const l = Math.hypot(_v2.x,_v2.z)||1; tx[i]=_v2.x/l; tz[i]=_v2.z/l;
  }
  return {x,z,tx,tz,n,len:(n-1)*STEP};
}

  out.x = x - tz*off; out.z = z + tx*off; out.tx = tx; out.tz = tz;

}

}

function update(dt){
  G.T += dt;
  const play = G.mode==='play' || G.mode==='attract';
  if(!play) return;
  // vågor
  for(const s of G.spawners){
    s.timer -= dt;
    while(s.left>0 && s.timer<=0){ spawnEnemy(s.t, s.path, s.hm); s.left--; s.timer += s.gap; }
  }
  G.spawners = G.spawners.filter(s=>s.left>0);
  if(!G.over && !G.waveReady && G.spawners.length===0 && G.wave < G.W){
    G.waveReady = true; G.countdown = G.mode==='attract' ? 2 : 20; hudWave();
  }
  if(G.waveReady && isFinite(G.countdown)){
    G.countdown -= dt;
    if(G.countdown <= 0){ G.countdown = Infinity; startWave(); }
  }
  if(G.mode==='attract' && G.wave===0 && G.waveReady){ G.attractT += dt; if(G.attractT>1.5){ G.attractT = 0; startWave(); } }
  if(G.rainCd>0) G.rainCd = Math.max(0, G.rainCd - dt);

  // riddare
  for(const e of G.enemies) e.held = false;
  for(const k of G.knights){
    const t = k.t;
    if(k.dead){ k.respawn -= dt; if(k.respawn<=0){ k.dead=false; k.hp=k.max; k.x=t.x; k.z=t.z; } continue; }
    const R = TT.barracks.range[t.lvl], [rx,rz] = t.rally;
    let e = k.target;
    if(e && (!e.alive || (e.x-rx)**2+(e.z-rz)**2 > (R+1.2)**2)){ release(k); e = null; }
    if(!e){
      let best = null, bd = 1e9;
      for(const o of G.enemies){
        if(!o.alive || o.holders >= (o.et.hold||1)) continue;
        const dr = (o.x-rx)**2 + (o.z-rz)**2; if(dr > R*R) continue;
        const dk = (o.x-k.x)**2 + (o.z-k.z)**2; if(dk < bd){ bd = dk; best = o; }
      }
      if(best){ k.target = best; best.holders++; e = best; }
    }
    let tx = k.hx, tz = k.hz, close = false;
    if(e){
      const dx = e.x-k.x, dz = e.z-k.z, d = Math.hypot(dx,dz), reach = e.type==='boss' ? 1.1 : e.type==='ram' ? .9 : .6;
      if(d <= reach+.05){ close = true; tx = k.x; tz = k.z; e.held = true; } else { tx = e.x - dx/d*reach; tz = e.z - dz/d*reach; }
      k.yaw = Math.atan2(-dx,-dz);
      if(close){
        k.cd -= dt;
        if(k.cd <= 0){ k.cd = .75; hurt(e, k.dmg, 'melee'); burst((e.x+k.x)/2,.7,(e.z+k.z)/2, Math.random()<.5?0xffe08a:0xffffff, 4, 2.6, .1, .3); Snd.clash(); }
        k.hp -= e.et.atk*dt / Math.max(1, e.holders);
        if(k.hp <= 0){ k.dead = true; k.respawn = knightStats(t).respawn; release(k); burst(k.x,.6,k.z,0x2f6be0,12,3,.15,.6); }
      }
    } else if(k.hp < k.max) k.hp = Math.min(k.max, k.hp + 6*dt);
    if(!close){
      const dx = tx-k.x, dz = tz-k.z, d = Math.hypot(dx,dz);
      if(d > .05){ const s = Math.min(d, 2.8*dt); k.x += dx/d*s; k.z += dz/d*s; if(!e) k.yaw = Math.atan2(-dx,-dz); k.ph += dt*12; }
    }
  }

  // fiender
  for(const e of G.enemies){
    if(!e.alive) continue;
    if(e.burnT>0){ e.burnT -= dt; hurt(e, e.burnD*dt, 'magic'); if(!e.alive) continue; if(Math.random()<dt*6) burst(e.x,.9,e.z,0xb07bff,1,1,.1,.5,2,-2); }
    let sp = e.spd;
    if(e.slowT>0){ e.slowT -= dt; sp *= 1 - e.slowF*(e.type==='boss'?.5:1); }
    if(!e.held){ e.d += sp*dt; e.ph += sp*dt*7; }
    if(e.flash>0) e.flash -= dt;
    pathAt(e.p, e.d, e.off); e.x = _pa.x; e.z = _pa.z; e.tx = _pa.tx; e.tz = _pa.tz;
    if(e.d >= e.p.len) hurtCastle(e);
  }

  // torn

    if(t.pulse>0){ t.pulse = Math.max(0, t.pulse-dt*3); const s = 1 + Math.sin(t.pulse*Math.PI)*.12; t.grp.scale.set(s, 1+Math.sin(t.pulse*Math.PI)*.18, s); }
    if(t.type==='barracks'){ if(t.flag) t.flag.rotation.y = Math.sin(G.T*3+t.x)*.4; continue; }
    if(t.orb){ t.orb.position.y = t.top + .62 + Math.sin(G.T*2.4 + t.x)*.08; t.orb.rotation.y += dt*2; }
    if(t.arm){ t.fire = Math.max(0, t.fire - dt*2.2); t.arm.rotation.x = .55 - Math.sin(Math.min(1,t.fire)*Math.PI)*1.7; t.armRock.visible = t.cd < t.lastRate - .4 || t.fire<=0; }
    t.cd -= dt;
    if(t.cd > 0) continue;
    const st = TT[t.type], R = st.range[t.lvl], R2 = R*R;
    // mål: den som kommit längst
    let best = null, bv = -1;
    const cand = t.type==='archer' ? [] : null;
    for(const e of G.enemies){
      if(!e.alive) continue;
      const dx = e.x-t.x, dz = e.z-t.z; if(dx*dx+dz*dz > R2) continue;
      const v = e.d/e.p.len;
      if(cand) cand.push(e);
      if(v > bv){ bv = v; best = e; }
    }
    if(!best){ t.cd = .1; continue; }
    const yaw = Math.atan2(-(best.x-t.x), -(best.z-t.z));
    if(t.type==='archer'){
      cand.sort((a,b)=>b.d/b.p.len - a.d/a.p.len);
      const n = st.shots[t.lvl];
      for(let k=0;k<n;k++){
        const e = cand[k % cand.length], ox = t.x, oy = t.top+.75, oz = t.z;
        const dist = Math.hypot(e.x-ox, e.z-oz);
        fireProj('arrow', ox+rand(-.15,.15), oy, oz+rand(-.15,.15), e, e.x, e.z, Math.max(.22, dist/13), .5+dist*.1, st.dmg[t.lvl], null);
      }
      for(const hd of t.heads) hd.rotation.y = yaw;
      t.cd = st.rate[t.lvl]; Snd.arrow();
    } else if(t.type==='catapult'){
      const dur = 1.05, pr = predict(best, dur);
      fireProj('rock', t.x, 1.7, t.z, null, pr.x, pr.z, dur, 3.4, st.dmg[t.lvl], st.splash[t.lvl]);
      t.yawG.rotation.y = yaw; t.fire = 1; t.cd = t.lastRate = st.rate[t.lvl]; Snd.thud();
    } else if(t.type==='mage'){
      const o = t.orb.position;
      fireProj('bolt', t.x, o.y, t.z, best, best.x, best.z, .35, .3, st.dmg[t.lvl], {slow:st.slow[t.lvl], dur:st.dur[t.lvl], burn:st.burn[t.lvl]});
      t.cd = st.rate[t.lvl]; Snd.zap();
      burst(t.x, o.y, t.z, 0xd8a6ff, 5, 1.5, .1, .35, 1, 0);
    }
  }

  // projektiler
  for(const p of G.projs){
    p.t += dt/p.dur;
    if(p.target && p.target.alive){ p.tx = p.target.x; p.tz = p.target.z; }
    const k = Math.min(1,p.t);
    const nx = p.x0+(p.tx-p.x0)*k, nz = p.z0+(p.tz-p.z0)*k, ny = p.y0+(p.ty-p.y0)*k + p.h*4*k*(1-k);
    p.dx = nx-p.px; p.dy = ny-p.py; p.dz = nz-p.pz; p.px = nx; p.py = ny; p.pz = nz;
    if(p.kind==='bolt' && Math.random()<.5) burst(nx,ny,nz,0xc58bff,1,.4,.09,.3,.3,0);
    if(p.kind==='rock' && Math.random()<.3) burst(nx,ny,nz,0x8a877a,1,.3,.08,.3,0,0);
    if(p.t >= 1){
      p.done = true;
      if(p.kind==='arrow'){ if(p.target && p.target.alive){ hurt(p.target, p.dmg, 'pierce'); burst(nx,.8,nz,0xffffff,2,1.5,.07,.2); } }
      else if(p.kind==='bolt'){
        const e = p.target;
        if(e && e.alive){ hurt(e, p.dmg, 'magic'); if(e.alive){ e.slowT = Math.max(e.slowT, p.extra.dur); e.slowF = p.extra.slow; e.burnT = Math.max(e.burnT, p.extra.dur); e.burnD = p.extra.burn; } }
        burst(nx,.8,nz,0xb07bff,8,2.5,.12,.4,2);
      } else if(p.kind==='rock'){
        const r2 = p.extra*p.extra;
        for(const e of G.enemies){ if(!e.alive) continue; const dx=e.x-nx, dz=e.z-nz, d2=dx*dx+dz*dz; if(d2<=r2) hurt(e, p.dmg*(1-.4*Math.sqrt(d2)/p.extra), 'blast'); }
        burst(nx,.3,nz,0x9c8a5a,18+p.extra*8,3+p.extra*2,.2,.6,5);
        burst(nx,.5,nz,0xffa040,8+p.extra*4,2+p.extra*1.5,.18,.35,3);
        G.shake = Math.max(G.shake,.15); Snd.boom();
      } else if(p.kind==='rain'){ burst(nx,.1,nz,0xc9b48a,2,1.2,.08,.25,1.5); }
    }
  }
  G.projs = G.projs.filter(p=>!p.done);

  // pilregn
  for(const r of G.rains){
    r.t += dt;
    while(r.spawned < 46 && r.t > r.spawned*.018){
      r.spawned++;
      const a = Math.random()*TAU, rr = Math.sqrt(Math.random())*r.r, x = r.x+Math.cos(a)*rr, z = r.z+Math.sin(a)*rr;
      fireProj('rain', x-1.2, 9, z-3.5, null, x, z, .42, 0, 0, null);
    }
    while(r.ticks < 3 && r.t > .45 + r.ticks*.28){
      r.ticks++;

  }

  G.enemies = G.enemies.filter(e=>e.alive);

  // vinst
  if(!G.over && G.mode==='play' && G.wave>=G.W && G.spawners.length===0 && G.enemies.length===0) win();

  }
  for(const f of castle.flags) f.rotation.y = Math.sin(G.T*3 + f.position.x)*.35;
}

  const rs = rainStats(), p = G.rainCd>0 ? G.rainCd/rs.cd*100 : 0;
  ui.rain.style.setProperty('--p', p.toFixed(1)+'%');
  const txt = G.rainCd>0 ? String(Math.ceil(G.rainCd)) : '';
  if(txt !== lastCdTxt){ lastCdTxt = txt; ui.rainCd.textContent = txt; ui.rain.classList.toggle('cool', G.rainCd>0); }
}
function hudAll(){ hudHp(); hudWave(); lastGold = -1; lastBonus = -2; hudTick(); ui.speed.textContent = '×'+G.speed; ui.speed.classList.toggle('on', G.speed>1); ui.rain.classList.remove('aim'); }
function banner(a, b){ const bn = $('banner'); bn.innerHTML = `${a}${b?`<small>${b}</small>`:''}`; bn.classList.remove('show'); void bn.offsetWidth; bn.classList.add('show'); }
function setTut(n){
  G.tut = n;
  const msg = n===0 ? 'Tryck på en byggplats för att bygga ett torn' : n===1 ? 'Tryck på Starta våg när du är redo' : '';
  ui.hint.hidden = !msg; ui.hint.textContent = msg;
  if(n>=2 && save.tut<1){ save.tut = 1; persist(); }
}

/* ---------- byggring ---------- */
let sel = null, pick = null;
const ringEl = $('ring');
const OPT_POS = [[-60,-60],[60,-60],[-60,60],[60,60]];
const ICON_UP = '<path d="M12 3 4 12h5v8h6v-8h5z"/>', ICON_SELL = '<circle cx="12" cy="12" r="8"/><path d="M11 7h2v10h-2z" fill="#7a1d16"/>';
function openRing(spot){ sel = spot; pick = null; renderRing(); placeRing(); Snd.click(); }
function closeRing(){ sel = null; pick = null; ringEl.hidden = true; rangeMesh.visible = false; }
function placeRing(){
  if(!sel) return;
  let [sx,sy] = toScreen(sel.x, .5, sel.z);
  sx = clamp(sx, 96, innerWidth-96); sy = clamp(sy, 90+safeTop, innerHeight-150-safeBot);
  ringEl.style.transform = `translate(${sx}px,${sy}px)`;
  const tip = ringEl.querySelector('.tip');
  if(tip){ tip.classList.toggle('below', sy < 250); tip.style.marginLeft = '0px'; const r = tip.getBoundingClientRect(); let dx = 0; if(r.left < 8) dx = 8 - r.left; else if(r.right > innerWidth-8) dx = innerWidth-8 - r.right; tip.style.marginLeft = dx+'px'; }
}
function renderRing(){
  if(!sel){ closeRing(); return; }
  ringEl.hidden = false;
  let h = '', tipH = '', tipP = '', go = '';
  const t = sel.tower;
  if(!t){
    TYPES.forEach((ty,i)=>{
      const c = price(ty,0), [x,y] = OPT_POS[i];
      h += `<button class="opt${G.gold<c?' poor':''}${pick===ty?' pick':''}" data-a="build" data-t="${ty}" style="--x:${x}px;--y:${y}px" aria-label="${TT[ty].name}"><svg viewBox="0 0 24 24">${TT[ty].icon}</svg><b>${c}</b></button>`;
    });
    if(pick){ const T2 = TT[pick], c = price(pick,0); tipH = `${T2.name} · ${c} guld`; tipP = T2.desc; go = G.gold>=c ? 'Tryck igen för att bygga' : `Du behöver ${c-G.gold} guld till`; showRange(sel.x, sel.z, T2.range[0]); }
    else { tipH = 'Bygg ett torn'; tipP = 'Välj ett torn. Tryck igen för att bygga.'; rangeMesh.visible = false; }
  } else {
    const T2 = TT[t.type], max = t.lvl>=2, c = max ? 0 : price(t.type, t.lvl+1), back = Math.round(t.spent*.7);
    h += `<button class="opt${max?' max':''}${!max&&G.gold<c?' poor':''}${pick==='up'?' pick':''}" data-a="up" style="--x:0px;--y:-72px" aria-label="Uppgradera"><svg viewBox="0 0 24 24">${ICON_UP}</svg><b>${max?'Max':c}</b></button>`;
    h += `<button class="opt sell${pick==='sell'?' pick':''}" data-a="sell" style="--x:0px;--y:72px" aria-label="Sälj"><svg viewBox="0 0 24 24">${ICON_SELL}</svg><b>+${back}</b></button>`;
    tipH = `${T2.name} · nivå ${t.lvl+1}`;
    if(pick==='up'){ tipP = T2.up + '.'; go = G.gold>=c ? 'Tryck igen för att uppgradera' : `Du behöver ${c-G.gold} guld till`; showRange(t.x, t.z, T2.range[t.lvl+1]); }
    else if(pick==='sell'){ tipP = `Du får tillbaka ${back} guld (70 %).`; go = 'Tryck igen för att sälja'; showRange(t.x, t.z, T2.range[t.lvl]); }
    else { tipP = max ? 'Fullt uppgraderat.' : `Nästa nivå: ${T2.up.toLowerCase()}.`; showRange(t.x, t.z, T2.range[t.lvl]); }
  }
  ringEl.innerHTML = h + `<div class="tip"><h4>${tipH}</h4><p>${tipP}</p>${go?`<p class="go">${go}</p>`:''}</div>`;
  placeRing();
}
ringEl.addEventListener('click', e => {
  const b = e.target.closest('.opt'); if(!b || !sel) return;
  Snd.init();
  const a = b.dataset.a, key = a==='build' ? b.dataset.t : a;
  if(pick !== key){ pick = key; Snd.click(); renderRing(); return; }
  if(a==='build'){ if(placeTower(sel, key)) closeRing(); else { Snd.click(); } }
  else if(a==='up'){ if(upgradeTower(sel.tower)) closeRing(); }
  else if(a==='sell'){ sellTower(sel.tower); closeRing(); }
});

/* ---------- pilregn ---------- */
function setRainAim(on){
  G.rainAim = on; ui.rain.classList.toggle('aim', on);
  if(on){ closeRing(); ui.hint.hidden = false; ui.hint.textContent = 'Dra på kartan och släpp där pilarna ska falla'; const rs = rainStats(); rainMesh.scale.set(rs.r,1,rs.r); }
  else { rainMesh.visible = false; if(G.tut>=2) ui.hint.hidden = true; else setTut(G.tut); }
}
function castRain(x,z){
  const rs = rainStats();
  G.rains.push({x, z, r:rs.r, dmg:rs.dmg, t:0, spawned:0, ticks:0});
  G.rainCd = rs.cd; setRainAim(false); Snd.rain(); G.shake = Math.max(G.shake,.2);
}

/* ================= Skärmar ================= */
const screens = ['start','mapScr','upgScr','pauseScr','resultScr'];
function show(id){ screens.forEach(s => $(s).hidden = s!==id); }
function starsUI(){ document.querySelectorAll('.starN').forEach(e=>e.textContent = starsTotal()); }
let mapSel = 0;

function toMenu(){
  loadLevel(0, 'attract');
  [[1,'archer',1],[3,'catapult',1],[5,'mage',1],[2,'barracks',1],[7,'archer',2],[4,'archer',0]].forEach(([i,ty,l])=>{
    const s = LV.spots[i]; if(!s) return; G.gold = 9999; placeTower(s,ty); for(let k=0;k<l;k++) upgradeTower(s.tower);
  });
  G.gold = 0; G.speed = 1;
  $('hud').hidden = true; show('start'); starsUI();
  const n = Math.min(save.unlocked, NL);
  $('playBtn').textContent = 'Spela bana ' + n;
}
function startLevel(L){
  Snd.init();
  const keepSpeed = G.speed;
  loadLevel(L, 'play'); G.speed = G.mode==='play' && keepSpeed>1 ? keepSpeed : 1;
  show(null); $('hud').hidden = false; hudAll();
  setTut(L===0 && save.tut<1 ? 0 : 2);
  const nt = newTypes(L);
  banner(`Bana ${L+1}`, LEVELS[L].name + (nt.length ? ` · ny fiende: ${nt.join(', ')}` : ''));
  Snd.horn();
}
function starsFor(){ const r = G.hp/G.hpMax; return r>=.95?3:r>=.6?2:1; }
function win(){
  if(G.over) return; G.over = true; closeRing(); setRainAim(false);
  const stars = starsFor(), L = G.L, prev = save.stars[L];
  save.stars[L] = Math.max(prev, stars);
  if(L+2 > save.unlocked) save.unlocked = Math.min(NL, L+2);
  persist();
  Snd.win();
  for(let i=0;i<30;i++) setTimeout(()=>burst(rand(-5,5), rand(4,7), CASTLE_Z-2+rand(-2,2), [0xf6c445,0x3b7cf0,0xe0473c,0x7ad66a][i%4], 14, 5, .14, 1.2, 4, 5), i*50);
  setTimeout(()=>{ G.mode='after'; showResult(true, stars, Math.max(0, save.stars[L]-prev)); }, 1500);
}
function lose(){
  if(G.over) return; G.over = true; closeRing(); setRainAim(false);
  G.collapse = .001; Snd.boom(); Snd.lose();
  setTimeout(()=>{ G.mode='after'; showResult(false, 0, 0); }, 1800);
}
function showResult(won, stars, gained){
  $('hud').hidden = true; show('resultScr');
  const last = G.L===NL-1 && won;
  $('resTitle').textContent = won ? (last ? 'Riket är räddat!' : 'Seger!') : 'Borgen föll';
  $('resSub').textContent = won ? `${LEVELS[G.L].name} är försvarad. Borgen har ${G.hp} av ${G.hpMax} liv kvar.` : `Du nådde våg ${G.wave} av ${G.W}.`;
  $('resSub2').textContent = won ? (gained>0 ? `+${gained} ${gained===1?'stjärna':'stjärnor'} att använda i Kungens råd.` : 'Inga nya stjärnor den här gången.') : 'Tips: bygg en riddarkasern där vägen svänger och uppgradera tornen.';
  $('resNext').textContent = won ? (last ? 'Spela banan igen' : 'Nästa bana') : 'Försök igen';
  const st = [...$('resStars').children]; st.forEach(s=>s.classList.remove('on'));
  $('resStars').style.display = won ? '' : 'none';
  st.slice(0,stars).forEach((s,i)=>setTimeout(()=>{ s.classList.add('on'); Snd.star(i); }, 350 + i*300));
}
function renderUpg(){
  $('starFree').textContent = starsFree();
  const list = $('upgList'); list.innerHTML = '';
  for(const k of Object.keys(UPG)){
    const u = UPG[k], l = save.upg[k], maxed = l>=u.max, cost = maxed?0:u.cost[l];
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<div class="ic"><svg viewBox="0 0 24 24">${u.icon}</svg></div>
      <div class="info"><h3>${u.name}</h3><p>${u.desc}</p><div class="pips">${Array.from({length:u.max},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('')}</div>
      <div class="val">${u.fmt(u.val(l))}${maxed?'':' → '+u.fmt(u.val(l+1))}</div></div>
      <button class="buy" ${maxed||starsFree()<cost?'disabled':''} aria-label="Köp ${u.name}">${maxed?'Max':`<i class="star"></i>${cost}`}</button>`;
    card.querySelector('.buy').addEventListener('click', ()=>{ if(maxed || starsFree()<cost) return; save.upg[k]++; persist(); Snd.coin(); renderUpg(); });
    list.appendChild(card);
  }
  $('upgPlay').textContent = 'Spela bana ' + (upgNext+1);
}
let upgNext = 0, upgFrom = 'start';
function openUpg(from, next){ upgFrom = from; upgNext = next; renderUpg(); show('upgScr'); }
const MAPPOS = [[58,392],[168,372],[246,312],[150,262],[56,206],[134,148],[238,104],[150,44]];
function levelTypes(L){ const s = new Set(); makeWaves(L).forEach(w=>w.g.forEach(g=>s.add(g.t))); return s; }
function newTypes(L){ const seen = L>0 ? levelTypes(L-1) : new Set(), out = []; for(const t of levelTypes(L)) if(!seen.has(t) && t!=='boss' && t!=='foot') out.push(ET[t].name.toLowerCase()); return out; }
function renderMap(){
  const svg = $('mapSvg');
  let d = `M${MAPPOS[0][0]} ${MAPPOS[0][1]}`;
  for(let i=1;i<NL;i++){ const [x0,y0] = MAPPOS[i-1], [x1,y1] = MAPPOS[i]; d += ` Q${(x0+x1)/2 + (i%2?30:-30)} ${(y0+y1)/2} ${x1} ${y1}`; }
  let h = `<path d="${d}" fill="none" stroke="#8a6a32" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/>`;
  // dekor: träd och berg
  const R = rng(5);
  for(let i=0;i<26;i++){ const x = 15+R()*270, y = 20+R()*395; if(MAPPOS.some(([a,b])=>Math.hypot(a-x,b-y)<34)) continue; h += `<path d="M${x} ${y-12} l7 13 h-14z" fill="#6f9a4a" opacity=".75"/><rect x="${x-1.2}" y="${y+1}" width="2.4" height="4" fill="#7a5230" opacity=".7"/>`; }
  h += `<path d="M20 70 l18-28 18 28z M44 72 l14-20 14 20z" fill="#a89a80" opacity=".8"/><path d="M226 400 q20 -18 46 -6 q-10 16 -46 6z" fill="#7fc3e6" opacity=".8"/>`;
  h += `<g transform="translate(150 22)"><rect x="-16" y="-10" width="32" height="14" fill="#c9c2b2" stroke="#6b5d43"/><path d="M-18 -10 l18 -12 18 12z" fill="#2f6be0"/></g>`;
  MAPPOS.forEach(([x,y],i)=>{
    const lock = i >= save.unlocked, done = save.stars[i] > 0;
    h += `<g class="node${lock?' lock':''}${done?' done':''}${i===mapSel?' sel':''}" data-i="${i}" role="button" aria-label="Bana ${i+1}">
      <circle class="ring" cx="${x}" cy="${y}" r="27"/><circle class="b" cx="${x}" cy="${y}" r="20"/>
      ${lock?`<path d="M${x-6} ${y-1}h12v9h-12z M${x-4} ${y-1}v-3a4 4 0 0 1 8 0v3" fill="#fff7e6" stroke="#fff7e6" stroke-width="1.6" fill-rule="evenodd"/>`:`<text class="n" x="${x}" y="${y+1}">${i+1}</text>`}
      ${done?`<text class="s" x="${x}" y="${y+33}">${'★'.repeat(save.stars[i])}${'☆'.repeat(3-save.stars[i])}</text>`:''}</g>`;
  });
  svg.innerHTML = h;
  svg.querySelectorAll('.node').forEach(n => n.addEventListener('click', ()=>{ const i = +n.dataset.i; if(i>=save.unlocked) return; Snd.init(); Snd.click(); mapSel = i; renderMap(); }));
  const lv = LEVELS[mapSel], news = newTypes(mapSel);
  $('mcName').innerHTML = `${mapSel+1}. ${lv.name}<span class="sts">${[0,1,2].map(k=>`<i class="${k<save.stars[mapSel]?'on':''}"></i>`).join('')}</span>`;
  $('mcSub').textContent = `${lv.W} vågor${lv.paths.length>1?' · två vägar in':''}${news.length?' · nytt: '+news.join(', '):''}`;
}
function openMap(){ mapSel = Math.min(save.unlocked-1, NL-1); renderMap(); show('mapScr'); }
function pause(){ if(G.mode!=='play' || G.over) return; G.mode='pause'; closeRing(); show('pauseScr'); }

/* ---------- knappar ---------- */
const on = (id, fn) => $(id).addEventListener('click', e => { Snd.init(); Snd.click(); fn(e); });
on('playBtn', ()=> startLevel(Math.min(save.unlocked-1, NL-1)));
on('mapBtn', openMap);
on('upgBtn1', ()=> openUpg('start', Math.min(save.unlocked-1, NL-1)));
on('mapBack', ()=> show('start'));
on('mcPlay', ()=> startLevel(mapSel));
on('upgBack', ()=> show(upgFrom));
on('upgPlay', ()=> startLevel(upgNext));
on('upgReset', ()=>{ for(const k in save.upg) save.upg[k] = 0; persist(); renderUpg(); });
on('pauseBtn', pause);
on('resumeBtn', ()=>{ G.mode='play'; show(null); });
on('restartBtn', ()=> startLevel(G.L));
on('quitBtn', ()=>{ toMenu(); openMap(); });
on('resNext', ()=>{ const won = save.stars[G.L]>0 && G.hp>0; startLevel(won ? Math.min(NL-1, G.L+1) : G.L); });
on('resUpg', ()=>{ const won = G.hp>0; openUpg('resultScr', won ? Math.min(NL-1, G.L+1) : G.L); });
on('resMap', ()=>{ toMenu(); openMap(); });
on('speedBtn', ()=>{ G.speed = G.speed>1 ? 1 : 2; ui.speed.textContent = '×'+G.speed; ui.speed.classList.toggle('on', G.speed>1); });
ui.waveBtn.addEventListener('click', ()=>{ Snd.init(); startWave(); });
ui.rain.addEventListener('click', ()=>{ Snd.init(); Snd.click(); if(G.mode!=='play' || G.over || G.rainCd>0) return; setRainAim(!G.rainAim); });
document.querySelectorAll('.sndbtn').forEach(b => b.addEventListener('click', ()=>{ setMute(!save.mute); Snd.click(); }));

/* ---------- styrning ---------- */
const _ray = new THREE.Raycaster(), _ndc = new THREE.Vector2(), _plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0), _hit = new THREE.Vector3();
function toGround(cx, cy){ _ndc.set(cx/innerWidth*2-1, -(cy/innerHeight)*2+1); _ray.setFromCamera(_ndc, camera); return _ray.ray.intersectPlane(_plane, _hit) ? _hit : null; }
let down = null;
canvas.addEventListener('pointerdown', e => {
  if(G.mode!=='play' || G.over) return;
  Snd.init();
  down = {id:e.pointerId, x:e.clientX, y:e.clientY};
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  if(G.rainAim){ const p = toGround(e.clientX, e.clientY); if(p){ rainMesh.position.set(p.x,0,p.z); rainMesh.visible = true; } }
});
canvas.addEventListener('pointermove', e => {
  if(!down || e.pointerId!==down.id) return;
  if(G.rainAim){ const p = toGround(e.clientX, e.clientY); if(p){ rainMesh.position.set(p.x,0,p.z); rainMesh.visible = true; } }
});
canvas.addEventListener('pointerup', e => {
  if(!down || e.pointerId!==down.id) return;
  const moved = Math.hypot(e.clientX-down.x, e.clientY-down.y); down = null;
  if(G.mode!=='play' || G.over) return;
  const p = toGround(e.clientX, e.clientY);
  if(G.rainAim){ if(p) castRain(p.x, p.z); return; }
  if(moved > 14 || !p) return;
  let best = null, bd = 1.1*1.1;
  for(const s of LV.spots){ const d = (s.x-p.x)**2 + (s.z-p.z)**2; if(d < bd){ bd = d; best = s; } }
  if(best && best !== sel) openRing(best); else closeRing();
});
canvas.addEventListener('pointercancel', () => { down = null; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => { if(e.key==='Escape'){ if(G.mode==='pause'){ G.mode='play'; show(null); } else if(G.rainAim) setRainAim(false); else if(sel) closeRing(); else pause(); } });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && !window.__noAutoPause) pause(); });
window.addEventListener('resize', fitCamera);

/* ================= Huvudloop ================= */
const fpsEl = $('fps'); let showFps = location.hash==='#fps'; fpsEl.hidden = !showFps;
let last = performance.now(), fAcc = 0, fN = 0, slowAcc = 0, slowN = 0;
function simulate(dt){
  if(G.mode!=='play' && G.mode!=='attract'){ return; }
  let s = dt * (G.mode==='play' ? G.speed : 1);
  while(s > 0){ const h = Math.min(s, .025); update(h); s -= h; }
}
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now;
  if(dt > .05) dt = .05;
  simulate(dt);
  if(G.mode==='after' && G.collapse>0){ G.collapse += dt; castle.g.position.y = -(Math.min(1, G.collapse/1.8)**2) * 3.5; }
  drawAll();
  updateParticles(G.mode==='pause' ? 0 : dt);
  updateFloats(dt);
  updateCamera(dt);
  if(G.mode==='play') hudTick();
  renderer.render(scene, camera);
  fAcc += dt; fN++;
  if(fAcc >= .5){
    const fps = fN/fAcc; window.__fps = fps;
    if(showFps) fpsEl.textContent = `${fps.toFixed(0)} fps · ${G.enemies.length} fiender · dpr ${pixelRatio}`;
    fAcc = 0; fN = 0;
    if(G.mode==='play'){ slowAcc += fps; slowN++; if(slowN>=4){ const avg = slowAcc/slowN; slowAcc=0; slowN=0; if(avg<45 && pixelRatio>1.25){ pixelRatio = Math.max(1.25, pixelRatio-.25); renderer.setPixelRatio(pixelRatio); fitCamera(); } } }
  }
}
// testkrokar
window.__bv = { G, LV, TT, ET, save:()=>save, startLevel, startWave, placeTower, upgradeTower, sellTower, castRain, toMenu, makeWaves,
  place(i, type){ return placeTower(LV.spots[i], type); },
  render(n=60){ let ms=0; for(let k=0;k<n;k++){ const t0=performance.now(); simulate(1/60); drawAll(); updateParticles(1/60); updateFloats(1/60); updateCamera(1/60); renderer.render(scene,camera); renderer.getContext().finish(); ms+=performance.now()-t0; } return +(ms/n).toFixed(2); },
  step(n=60, dt=1/60){ for(let k=0;k<n;k++) simulate(dt); drawAll(); return {mode:G.mode, hp:G.hp, gold:G.gold, wave:G.wave, enemies:G.enemies.length, over:G.over}; },
  spawn(type, n){ for(let i=0;i<n;i++){ spawnEnemy(type, i%LV.paths.length, 1); G.enemies[G.enemies.length-1].d = rand(0, LV.paths[i%LV.paths.length].len*.8); } },
  fps:()=>window.__fps, showFps(){ showFps=true; fpsEl.hidden=false; } };

fitCamera();
setMute(save.mute);
toMenu();
requestAnimationFrame(t => { last = t; frame(t); });
if(document.fonts && document.fonts.load){ document.fonts.load('40px "Lilita One"').then(()=>{ if(LV.spots.length){ const t = makeSpotTex(String(price('archer',0))); for(const s of LV.spots){ s.mesh.children[1].material.map = t; s.mesh.children[1].material.needsUpdate = true; } } }).catch(()=>{}); }
</script>
