<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16213f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Riddarportar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="icon" type="image/png" href="ikon-192.png">
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<title>Riddarportarna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;800&family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: fullskärms-3D med HUD i kanterna och menyer som mittpaneler. En fast spelvärld, ett tema. */
:root{
  --navy:#16213f; --navy-2:#223062; --panel:rgba(18,26,56,.86);
  --gold:#f6c445; --gold-dk:#b9831c; --blue:#3b7cf0; --red:#e0473c; --boss:#9b45d6;
  --leaf:#4cae4f; --leaf-dk:#2f7d33; --paper:#fff7e6; --muted:#b9c3e6;
  --f-title:"Grenze Gotisch","Times New Roman",serif;
  --f-ui:"Lilita One","Arial Black",Impact,system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#7fc6ee;}
body{color:var(--paper);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
#app{position:fixed;inset:0;overflow:hidden;}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--f-ui);}
#hud .top{position:absolute;left:0;right:0;top:0;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;}
.iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:14px;background:var(--panel);display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.35);flex:none;}
.iconbtn svg{width:22px;height:22px;fill:var(--paper);}
.musbtn .muoff{display:none}
.musbtn.off .muoff{display:inline}
.musbtn.off .muon{opacity:.45}
.bar{flex:1;min-width:0;position:relative;height:30px;border-radius:15px;background:rgba(10,14,30,.7);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 2px 0 rgba(0,0,0,.25);overflow:hidden;}
.bar .fill{position:absolute;inset:3px auto 3px 3px;border-radius:12px;width:calc(100% - 6px);transform-origin:left;transition:width .15s;}
#ehpFill{background:linear-gradient(#ff7a6b,#d0332a);}
#ebar.boss #ehpFill,#bossFill{background:linear-gradient(#d9a6ff,#7b33cf);}
#phpFill{background:linear-gradient(#7fb2ff,#2f62d6);}
.bar .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:17px;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.55);font-variant-numeric:tabular-nums;z-index:2;}
.bar .lbl svg{width:16px;height:16px;fill:currentColor;}
.tick{position:absolute;top:3px;height:7px;width:3px;margin-left:-1px;background:rgba(255,255,255,.85);border-radius:2px;z-index:1;}
#lvlTag{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 50px);transform:translateX(-50%);font-size:15px;color:var(--paper);text-shadow:0 2px 0 rgba(0,0,0,.5);letter-spacing:.06em;white-space:nowrap;}
#bossbar{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);max-width:440px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:3px;}
#bossbar .bname{font-size:15px;letter-spacing:.12em;text-align:center;color:#f1d6ff;text-shadow:0 2px 0 rgba(0,0,0,.6);}
#bossbar .bar{flex:none;height:24px;box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 0 2px rgba(155,69,214,.7);}
#bossbar .lbl{font-size:15px;}
#hud.bosslv #lvlTag{display:none}
#combo{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 66px);text-align:left;transform-origin:left center;font-size:22px;color:#ffe08a;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 14px rgba(255,190,40,.5);white-space:nowrap;opacity:0;transition:opacity .3s;}
#combo b{font-weight:400;font-size:34px;}
#combo.on{opacity:1}
#hud.giantlv #combo{top:calc(env(safe-area-inset-top,0px) + 108px);}
#hud .bottom{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));display:flex;align-items:flex-end;gap:10px;}
.pbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
.pbox .bar{flex:none;}
#army{align-self:flex-start;background:var(--panel);border-radius:12px;padding:5px 10px;font-size:16px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;}
#army svg{width:16px;height:16px;fill:#9cc0ff;}
#champBtn{pointer-events:auto;position:relative;width:72px;height:72px;border-radius:20px;background:linear-gradient(#ffd866,#e4a420);box-shadow:0 5px 0 var(--gold-dk),0 8px 14px rgba(0,0,0,.35);display:grid;place-items:center;flex:none;transition:transform .08s;}
#champBtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-dk);}
#champBtn svg{width:40px;height:40px;fill:#5a3a06;}
#champBtn .n{position:absolute;right:-6px;top:-6px;background:var(--red);color:#fff;border-radius:12px;min-width:26px;height:26px;display:grid;place-items:center;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.35);}
#champBtn.off{filter:grayscale(1) brightness(.7);}
#champBtn[hidden]{display:none!important}
/* krafter */
.side{position:absolute;left:0;right:0;max-width:560px;margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:flex-end;pointer-events:none;}
.powers{display:flex;flex-direction:column;align-items:center;gap:9px;}
.powers .plbl{font-size:12px;letter-spacing:.12em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6);}
.pw{--p:0;--c:#6fb0ff;pointer-events:auto;position:relative;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 360deg),rgba(10,14,30,.78) 0deg);box-shadow:0 4px 0 rgba(0,0,0,.4);display:grid;place-items:center;transition:transform .08s;}
.pw::before{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--navy);}
.pw svg{position:relative;width:30px;height:30px;fill:#fff;opacity:.5;}
.pw.ready svg{opacity:1}
.pw.ready{animation:glow .8s ease-in-out infinite alternate;}
.pw:active{transform:scale(.92);}
@keyframes glow{from{box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 0 0 var(--c)}to{box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 20px 7px var(--c)}}
.pw .cd{position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;font-size:21px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6);}
.pw .cd:empty{display:none}
.pw.cool svg{opacity:.2}
.pop{animation:pop .28s ease-out;}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);transform:translateX(-50%);background:var(--panel);padding:10px 16px;border-radius:14px;font-family:var(--f-body);font-weight:800;font-size:15px;white-space:nowrap;animation:bob 1.2s ease-in-out infinite;}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
#flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(224,40,30,.0);transition:box-shadow .25s;}
#flash.on{box-shadow:inset 0 0 120px 30px rgba(224,40,30,.65);transition:none;}
#frost{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 100px 26px rgba(160,225,255,0);transition:box-shadow .35s;}
#frost.on{box-shadow:inset 0 0 100px 26px rgba(160,225,255,.75);}
#frost.storm{box-shadow:inset 0 0 90px 18px rgba(110,170,255,.55);}
#floats{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.ft{position:absolute;left:0;top:0;font-family:var(--f-ui);font-size:26px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 10px rgba(0,0,0,.25);white-space:nowrap;will-change:transform,opacity;}
.ft.good{color:#bfe3ff}.ft.bad{color:#ffb0a8}.ft.gold{color:#ffe08a;font-size:32px}
.ft.dmg{color:#fff1c7;font-size:24px}
.ft.small{font-size:18px}
.ft.huge{font-size:56px;text-shadow:0 4px 0 rgba(0,0,0,.5),0 0 18px rgba(0,0,0,.3)}
.ft.huge.good{color:#a8dbff}.ft.huge.bad{color:#ff9a8c}.ft.huge.gold{color:#ffd54a}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--f-ui);font-size:46px;line-height:1.05;padding:0 12px;text-shadow:0 4px 0 rgba(0,0,0,.45);pointer-events:none;opacity:0;text-wrap:balance;}
#banner.show{animation:banner 1.8s ease-out forwards;}
#banner.boss{color:#f1d6ff}
#banner small{display:block;font-size:20px;color:var(--gold);margin-top:6px;}
@keyframes banner{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#fps{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 62px);font:12px/1 ui-monospace,monospace;background:rgba(0,0,0,.5);padding:4px 6px;border-radius:6px;}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));overflow-y:auto;}
.scrim{background:linear-gradient(rgba(12,18,40,.15),rgba(12,18,40,.55));}
.panel{width:100%;max-width:400px;background:var(--panel);border-radius:26px;padding:22px 18px;box-shadow:0 0 0 3px rgba(246,196,69,.55),0 18px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:14px;align-items:stretch;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);margin:auto 0;}
.panel h2{margin:0;text-align:center;font-family:var(--f-ui);font-weight:400;font-size:34px;letter-spacing:.01em;text-wrap:balance;}
.btn{font-family:var(--f-ui);font-size:24px;padding:14px 18px;border-radius:18px;background:linear-gradient(#ffd866,#eaa922);color:#3f2700;box-shadow:0 6px 0 var(--gold-dk),0 10px 18px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s;display:flex;align-items:center;justify-content:center;gap:10px;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-dk);}
.btn.green{background:linear-gradient(#7ad66a,#3f9c3a);color:#fff;box-shadow:0 6px 0 #2a6b27,0 10px 18px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.3);}
.btn.green:active{box-shadow:0 2px 0 #2a6b27;}
.btn.ghost{background:var(--panel);color:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.35);font-size:19px;padding:11px 14px;}
.btn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.35);}
.btn[disabled]{filter:grayscale(.9) brightness(.75);pointer-events:none;}
.row{display:flex;gap:10px;}
.row>*{flex:1;min-width:0;}
.coinpill{align-self:center;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border-radius:999px;padding:6px 14px 6px 8px;font-family:var(--f-ui);font-size:22px;font-variant-numeric:tabular-nums;}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f6c445 45%,#c98c12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);flex:none;}

/* start */
#start{justify-content:space-between;}
.titleblock{margin-top:6vh;text-align:center;filter:drop-shadow(0 6px 0 rgba(20,20,50,.35));}
.titleblock h1{margin:0;font-family:var(--f-title);font-weight:800;font-size:clamp(52px,15vw,92px);line-height:.9;color:var(--paper);-webkit-text-stroke:2px #3a2508;text-shadow:0 4px 0 #3a2508,0 8px 0 rgba(0,0,0,.25);}
.titleblock h1 span{display:block;color:var(--gold);}
.titleblock p{margin:14px auto 0;max-width:30ch;font-weight:800;font-size:16px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.6);text-wrap:balance;}
.startmenu{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;margin-bottom:2vh;}
.startmenu .btn.green{font-size:30px;padding:18px;}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.lvbtn{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--navy-2);font-family:var(--f-ui);font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.4);}
.lvbtn .st{display:flex;gap:1px}
.lvbtn .st i{width:10px;height:10px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:rgba(255,255,255,.2);}
.lvbtn .st i.on{background:var(--gold);}
.lvbtn .bt{font-size:9px;letter-spacing:.08em;color:#f1d6ff;margin-top:-2px;}
.lvbtn.boss{background:#5a2a7c;}
.lvbtn.cur{background:var(--blue);}
.lvbtn.boss.cur{background:#8a3fc0;}
.lvbtn[disabled]{opacity:.35;pointer-events:none;}

/* result */
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0 2px;}
.stars i{width:66px;height:66px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:rgba(255,255,255,.14);transform:scale(.6);transition:transform .3s cubic-bezier(.3,1.8,.5,1),background .2s;}
.stars i:nth-child(2){width:80px;height:80px;margin-top:-12px;}
.stars i.on{background:linear-gradient(#fff2a6,#f6c445 50%,#d8961a);transform:scale(1);}
.reslines{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:16px;color:var(--muted);text-align:center;}
#resCoins{font-size:28px;}

/* shop */
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.3);border-radius:14px;padding:4px;}
.tab{flex:1;font-family:var(--f-ui);font-size:18px;padding:8px;border-radius:10px;color:var(--muted);}
.tab.on{background:var(--navy-2);color:var(--paper);box-shadow:0 2px 0 rgba(0,0,0,.35);}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:middle;}
.cards{display:flex;flex-direction:column;gap:10px;}
.card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border-radius:18px;padding:10px;}
.card.locked{opacity:.55}
.card .ic{width:52px;height:52px;border-radius:14px;background:var(--navy-2);display:grid;place-items:center;flex:none;}
.card .ic svg{width:32px;height:32px;fill:var(--gold);}
.card .info{flex:1;min-width:0;}
.card h3{margin:0;font-family:var(--f-ui);font-weight:400;font-size:20px;}
.card p{margin:2px 0 4px;font-size:13px;color:var(--muted);}
.pips{display:flex;gap:3px;}
.pips i{flex:1;max-width:18px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);}
.pips i.on{background:var(--gold);}
.card .val{font-size:13px;font-weight:900;margin-top:4px;color:#cfe0ff;}
.buy{font-family:var(--f-ui);font-size:18px;min-width:84px;padding:10px 10px;border-radius:14px;background:linear-gradient(#7ad66a,#3f9c3a);box-shadow:0 4px 0 #2a6b27;display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;flex:none;}
.buy .coin{width:18px;height:18px;}
.buy:active{transform:translateY(3px);box-shadow:0 1px 0 #2a6b27;}
.buy[disabled]{background:rgba(255,255,255,.12);box-shadow:none;color:var(--muted);pointer-events:none;}
.tiny{font-size:12px;color:var(--muted);text-align:center;}

/* introkort */
.introcard{gap:12px;}
.kick{align-self:center;font-family:var(--f-ui);font-size:14px;letter-spacing:.14em;color:#3f2700;background:var(--gold);padding:4px 12px;border-radius:999px;}
.kick.boss{background:var(--boss);color:#fff;}
.kick.pow{background:#6fb0ff;color:#0d2050;}
.cardpic{align-self:center;width:100%;max-width:300px;aspect-ratio:1.6;border-radius:18px;background:radial-gradient(circle at 50% 38%,#a6dcf5,#3d6aa8 75%);overflow:hidden;display:grid;place-items:center;box-shadow:inset 0 0 0 3px rgba(255,255,255,.14);}
.cardpic canvas{width:100%;height:100%;display:block;}
.cardpic svg{width:42%;height:auto;fill:#fff;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3));}
.cardtext{margin:0;text-align:center;font-weight:800;font-size:17px;line-height:1.35;color:#e6ecff;text-wrap:pretty;}
.cardcount{font-size:12px;color:var(--muted);text-align:center;font-weight:800;}
@media (prefers-reduced-motion:reduce){#hint{animation:none}.pop{animation:none}.pw.ready{animation:none;box-shadow:0 0 14px 5px var(--c)}}
</style>

<div id="app">
  <canvas id="c"></canvas>

  <div id="hud" hidden>
    <div class="top">
      <button class="iconbtn" id="pauseBtn" aria-label="Paus"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
      <div class="bar" id="ebar"><div class="fill" id="ehpFill"></div><div class="lbl"><svg viewBox="0 0 24 24"><path d="M3 21V9l3 2V6l3 2V3h6v5l3-2v5l3-2v12z"/></svg><span id="ehpName"></span><span id="ehp">0</span></div></div>
      <button class="iconbtn sndbtn" aria-label="Ljud av eller på"><svg viewBox="0 0 24 24"><path class="sndon" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff7e6" stroke-width="2" fill="none"/><path class="sndoff" d="M16 9l6 6M22 9l-6 6" stroke="#ff8a7a" stroke-width="2.4" fill="none"/><path d="M4 9h4l5-4v14l-5-4H4z"/></svg></button>
      <button class="iconbtn musbtn" aria-label="Musik av eller på"><svg viewBox="0 0 24 24"><g class="muon"><path d="M9 17V5.5l11-2.5v12" stroke="#fff7e6" stroke-width="2.2" fill="none"/><circle cx="6.5" cy="17.5" r="2.7"/><circle cx="17.5" cy="15" r="2.7"/></g><path class="muoff" d="M3 3l18 18" stroke="#ff8a7a" stroke-width="2.6" fill="none"/></svg></button>
    </div>
    <div id="lvlTag">BANA 1</div>
    <div id="bossbar" hidden><div class="bname" id="bossName">JÄTTEN</div><div class="bar" id="bbar"><div class="fill" id="bossFill"></div><div class="lbl"><span id="bossHp">0</span></div></div></div>
    <div id="combo">KOMBO <b>×2</b></div>
    <div id="hint">Håll inne och dra för att skjuta</div>
    <div class="side">
      <div class="powers" id="powers">
        <span class="plbl" id="plbl">KRAFT</span>

const Snd = {
  ctx:null, master:null, nb:null, last:{},
  init(){
    try{
      if(!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
        this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
        const n = this.ctx.sampleRate*0.5|0; this.nb = this.ctx.createBuffer(1,n,this.ctx.sampleRate);
        const d = this.nb.getChannelData(0); for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
      }
      this.master.gain.value = save.mute ? 0 : 0.55;
      if(this.ctx.state === 'suspended') this.ctx.resume();

  ok(key, gap){ if(!this.ctx || save.mute || game.sim) return false; const t=this.ctx.currentTime; if(key && this.last[key] && t-this.last[key]<gap) return false; if(key) this.last[key]=t; return true; },
  toneAt(t,f,d,type='square',v=.2,f2=null,dest=null){
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();

    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);

  },
  tone(f,d,type='square',v=.2,f2=null,delay=0){ this.toneAt(this.ctx.currentTime+delay,f,d,type,v,f2); },

// Musik: trumslinga och bas, tempot ökar när fiendeborgen har lite HP kvar
const Music = {
  g:null, next:0, step:0, bpm:100,
  tick(){
    const c = Snd.ctx; if(!c) return;
    const want = save.music && !save.mute && game.mode==='play' && !game.over;
    if(!this.g){ this.g = c.createGain(); this.g.gain.value = 0; this.g.connect(Snd.master); }
    this.g.gain.setTargetAtTime(want ? .34 : 0, c.currentTime, .12);
    if(!want){ this.next = 0; return; }
    const fr = game.ehp/game.ehpMax, hot = fr < .3;
    const target = 100 + (game.lv.boss ? 10 : 0) + (hot ? 38 : fr < .6 ? 14 : 0);
    this.bpm += (target - this.bpm) * .03;
    const s16 = 60/this.bpm/4;
    if(this.next < c.currentTime) this.next = c.currentTime + .05;
    while(this.next < c.currentTime + .2){ this.play(this.step, this.next, s16, hot); this.next += s16; this.step = (this.step+1) % 64; }
  },
  play(s, t, s16, hot){
    const b = s % 16, bar = (s >> 4) & 3, dst = this.g, boss = !!game.lv.boss;
    if(b===0 || b===8 || (b===10 && hot) || (b===14 && bar===3)){ Snd.toneAt(t,150,.16,'sine',.9,42,dst); }
    if(b===4 || b===12){ Snd.noiseAt(t,.13,.45,1800,.8,'bandpass',dst); Snd.toneAt(t,190,.08,'triangle',.25,140,dst); }
    if(hot && (b===13 || b===15)) Snd.noiseAt(t,.08,.25,2200,.8,'bandpass',dst);
    if(b%2===0 || hot) Snd.noiseAt(t,.035,b%4===2?.16:.08,8000,1,'highpass',dst);
    const roots = boss ? [110,103.83,98,92.5] : [146.83,116.54,130.81,110];
    if(b===0 || b===3 || b===6 || b===10 || b===13) Snd.toneAt(t, roots[bar]*(b===10?1.5:1), s16*2.2, 'sawtooth', .16, null, dst);
    if(hot && (b===0 || b===8)) Snd.toneAt(t, roots[bar]*4, s16*1.6, 'square', .05, null, dst);
  },
};

const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _one = new THREE.Vector3(1,1,1);
function part(geo, color, x=0,y=0,z=0, rx=0,ry=0,rz=0, sx=1,sy=1,sz=1){
  let g = geo.index ? geo.toNonIndexed() : geo;
  g.deleteAttribute('uv');
  _m4.compose(_v.set(x,y,z), _q.setFromEuler(_e.set(rx,ry,rz)), new THREE.Vector3(sx,sy,sz));
  g.applyMatrix4(_m4);
  const c = new THREE.Color(color), n = g.attributes.position.count, a = new Float32Array(n*3);
  for(let i=0;i<n;i++){ a[i*3]=c.r; a[i*3+1]=c.g; a[i*3+2]=c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(a,3));
  return g;
}
function merge(parts){
  let tot = 0; for(const p of parts) tot += p.attributes.position.count;
  const pos = new Float32Array(tot*3), nor = new Float32Array(tot*3), col = new Float32Array(tot*3);
  let o = 0;
  for(const p of parts){ pos.set(p.attributes.position.array,o*3); nor.set(p.attributes.normal.array,o*3); col.set(p.attributes.color.array,o*3); o += p.attributes.position.count; p.dispose(); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.computeBoundingSphere();
  return g;
}

const _dir = new THREE.Vector3(), _Z = new THREE.Vector3(0,0,1), _s1 = new THREE.Vector3(1,1,1);

  if(a.fire){ burst(a.x1,.3,a.z1,0xffa020,6,3,.18,.4); return; }
  let best = .9*.9, bj = -1;
  for(let j=0;j<B.n;j++){ if(B.dead[j]) continue; const dx=B.x[j]-a.x1, dz=B.z[j]-a.z1, d=dx*dx+dz*dz; if(d<best){ best=d; bj=j; } }
  if(bj>=0){ B.dead[bj]=1; burst(B.x[bj],.8,B.z[bj],0x5d8ef5,5,2.5,.13,.4); }
  else burst(a.x1,.2,a.z1,0xc9b48a,3,1.5,.1,.3);
}

/* ---------- datorspelare: används av balanssimuleringen och testerna ---------- */
function dangerLanes(){
  const out = [];
  if(dragon.on && !dragon.dead && (dragon.st==='warn' || dragon.st==='breath' || dragon.st==='move')) out.push(...dragon.lanes);
  return out;
}
function botTick(dt){
  const sk = game.botSkill;
  game.botT -= dt; if(game.botT > 0) return; game.botT = .2 + (1-sk)*.5;
  game.firing = true;
  const alert = Math.random() < .45 + .55*sk;
  const lanes = alert ? dangerLanes() : [];
  let best = -1e9, bx = game.targetX;
  for(let x=-4.4; x<=4.41; x+=.2){
    let s = 0;
    for(const g of gates){
      const tt = Math.max(0,(SPAWN_Z - g.z)/BSPD);
      const gx = g.amp && sk>.7 ? clamp(g.x + Math.sin((game.T+tt)*g.spd + g.ph)*g.amp, -5.2+g.w/2, 5.2-g.w/2) : g.cx;
      if(Math.abs(x-gx) < g.w/2 - .3){
        let t = g.t, v = g.v; if(t==='mys' && g.cur){ t = g.cur.t; v = g.cur.v; }
        s += t==='mul' ? v*3 : t==='gold' ? 20 : t==='add' ? (g.cd>1 ? 1 : v*.35) : t==='mys' ? 2 : t==='sub' ? -5 : t==='div' ? -v*3 : 0;
      }
    }
    for(const lx of lanes) if(Math.abs(x-lx) < 1.6) s -= 60;
    if(alert) for(const c of cshots) if(c.T-c.t < 1.3 && Math.abs(x-c.x1) < 1.7) s -= 40;
    if(giant.alive && Math.abs(x-giant.x) < 1.2) s += 15;
    s -= Math.abs(x-game.targetX)*.5;
    if(s>best){ best = s; bx = x; }
  }
  game.targetX = clamp(bx + (Math.random()+Math.random()+Math.random()-1.5)*(1-sk)*1.6, -XL, XL);
  if(game.meter>=METER && Math.random() < .3+.7*sk){
    let near = 0; for(let i=0;i<Rd.n;i++) if(Rd.z[i] > -2) near++;
    if(powUnlocked('ice') && game.pcd.ice<=0 && (lanes.length || (giant.alive && giant.st==='wind') || near>14)) usePower('ice');
    else if(powUnlocked('fire') && game.pcd.fire<=0 && (near>6 || game.lv.boss)) usePower('fire');
    else if(powUnlocked('storm') && game.pcd.storm<=0) usePower('storm');
  }
  if(game.champLeft>0 && (Rd.n > 22 || (giant.alive && giant.z > -6) || game.ehp/game.ehpMax < .3)) sendChamp();
}

/* ================= Uppdatering ================= */
function update(dt){
  game.T += dt;
  const mode = game.mode, play = mode==='play', lv = game.lv;
  const sim = play || mode==='attract' || mode==='after';
  if(game.iceT>0){ game.iceT -= dt; if(game.iceT<=0) setFrozen(false); }
  const frozen = game.iceT>0;
  if(game.stormT>0){ game.stormT -= dt; if(!game.sim) ui.frost.classList.toggle('storm', game.stormT>0); }
  for(const k of POWS) if(game.pcd[k]>0) game.pcd[k] -= dt;
  if(game.stun>0) game.stun -= dt;
  if(game.comboT>0){ game.comboT -= dt; if(game.comboT<=0){ game.comboN = 0; if(!game.sim) ui.combo.classList.remove('on'); } }
  if(game.dmgAccT>0){ game.dmgAccT -= dt; if(game.dmgAccT<=0 && game.dmgAcc>0){ floatText('−'+Math.round(game.dmgAcc), game.dmgAccX, dragon.on?8:5.5, EZ+.5, 'dmg'); game.dmgAcc = 0; } }
  if(game.gAccT>0){ game.gAccT -= dt; if(game.gAccT<=0 && game.gAcc>0){ floatText('−'+Math.round(game.gAcc), giant.x, 8, giant.z, 'dmg'); game.gAcc = 0; } }
  if(game.castleFlash>0){ game.castleFlash -= dt; }
  enemyC.mat.emissive.setRGB(game.castleFlash>0?.35:0, game.castleFlash>0?.12:0, game.castleFlash>0?.05:0);

  // sikte
  if(mode==='attract'){
    game.autoT += dt;
    game.targetX = Math.sin(game.autoT*.7)*3.2 + Math.sin(game.autoT*1.9)*.8;
    game.firing = true;
  }
  if(game.bot && play && !game.over) botTick(dt);
  game.aimX += (game.targetX - game.aimX) * Math.min(1, dt*14);
  ballista.position.x = game.aimX;
  aimLine.position.x = game.aimX;
  aimLine.material.opacity += ((play && game.firing && !game.over ? .28 : 0) - aimLine.material.opacity)*Math.min(1,dt*10);
  const rec = ballista.userData.recoil || 0; ballista.userData.recoil = Math.max(0, rec - dt*7);
  ballista.userData.bow.scale.set(1 - rec*.12, 1, 1);
  ballista.userData.bolt.position.z = -.5 + rec*.5;
  ballista.rotation.z = game.stun>0 ? Math.sin(game.T*40)*.08 : 0;

  if(sim && !game.over && mode!=='after'){
    const rate = mode==='attract' ? 3 : UPG.rate.val(save.upg.rate) * (game.stormT>0 ? 1.15 : 1);
    game.fireT -= dt;
    if(game.firing && game.fireT<=0 && game.stun<=0){ fire(); game.fireT = 1/rate; }
    if(!frozen){
      game.waveT -= dt;
      if(game.waveT<=0){ spawnWave(); game.waveT = lv.every*TUNE.every*rand(.85,1.15); }
      if(play){
        if(lv.cav){ game.cavT -= dt; if(game.cavT<=0){ warnCav(); game.cavT = lv.cav.every*rand(.85,1.15); } }
        if(lv.shield){ game.shT -= dt; if(game.shT<=0){ spawnShield(); game.shT = lv.shield.every*rand(.9,1.1); } }
        if(lv.cannon){ game.canT -= dt; if(game.canT<=0){ fireCannon(); game.canT = lv.cannon*rand(.85,1.15)*(game.ehp/game.ehpMax<.35?.8:1); } }
      }
    }
    if(play && lv.gold){ game.goldT -= dt; if(game.goldT<=0){ spawnGold(); game.goldT = lv.gold*rand(.85,1.2); } }
  }
  updateCavWarn(dt, frozen);
  updateGates(dt);

  if(sim){
    buildB(B, BB); buildB(Rd, RB);
    // röda
    for(let i=0;i<Rd.n;i++){
      if(Rd.dead[i]) continue;
      const k = Rd.kind[i];
      if(!frozen){
        const x = Rd.x[i], z = Rd.z[i];
        if(k<=1){
          const b0 = bIdx(z); let best = 9, bdx = 0;
          for(let b=b0; b<=Math.min(NBK-1,b0+2); b++) for(let q=BB.start[b]; q<BB.start[b+1]; q++){
            const j = BB.list[q]; const dz = B.z[j]-z; if(dz<0 || dz>4.5) continue;
            const dx = B.x[j]-x; if(dx>3 || dx<-3) continue;
            const d = dx*dx + dz*dz; if(d<best){ best=d; bdx=dx; }
          }
          const tv = best<9 ? clamp(bdx*3,-2.2,2.2) : 0;
          Rd.vx[i] += (tv - Rd.vx[i])*Math.min(1,dt*6);
        } else Rd.vx[i] *= .9;
        Rd.x[i] = clamp(x + Rd.vx[i]*dt, -XL, XL);
        Rd.z[i] = z + (Rd.sp[i] || lv.rs)*dt;
        if(Rd.hop[i]>0) Rd.hop[i]-=dt;
      }
      if(play && Rd.z[i] > 4 && Rd.z[i]-(Rd.sp[i]||lv.rs)*dt <= 4 && Math.abs(Rd.x[i]-game.aimX) > 2 && game.T - (game.warnT||-9) > 2.5){ game.warnT = game.T; floatText('!', Rd.x[i], 2.4, Rd.z[i], 'huge bad', 1.1); Snd.bad(); }
      if(Rd.z[i] > PZ-.6){ Rd.dead[i]=1; hurtPlayer(Rd.x[i], k===0||k===3 ? 1 : 2); }
    }
    // blå
    const gAlive = giant.on && giant.alive;
    for(let i=0;i<B.n;i++){
      if(B.dead[i]) continue;
      const x = B.x[i], z = B.z[i], b0 = bIdx(z);
      let best = 9, bdx = 0;
      for(let b=Math.max(0,b0-2); b<=b0; b++) for(let q=RB.start[b]; q<RB.start[b+1]; q++){
        const j = RB.list[q]; if(Rd.dead[j]) continue;
        const dz = z - Rd.z[j]; if(dz<0 || dz>4) continue;
        const dx = Rd.x[j]-x; if(dx>2.6 || dx<-2.6) continue;
        const d = dx*dx+dz*dz; if(d<best){ best=d; bdx=dx; }
      }
      const tv = best<9 ? clamp(bdx*3,-2.6,2.6) : 0;
      B.vx[i] += (tv - B.vx[i])*Math.min(1,dt*6);
      const nx = clamp(x + B.vx[i]*dt, -XL, XL), nz = z - BSPD*dt;
      B.x[i] = nx; B.z[i] = nz;
      if(B.hop[i]>0) B.hop[i]-=dt;
      for(const g of gates){
        if(B.mask[i] & g.bit) continue;
        if(z > g.z && nz <= g.z && Math.abs(nx-g.cx) < g.w/2){ B.mask[i] |= g.bit; applyGate(g, i); if(B.dead[i]) break; }
      }
      if(B.dead[i]) continue;
      if(gAlive){ const dx = nx-giant.x, dz = nz-giant.z; if(dx>-1.5 && dx<1.5 && dz>-1 && dz<1.2){ B.dead[i]=1; damageBoss(1, nx, nz); burst(nx,1.5,nz,0xffd24a,2,3,.12,.3); continue; } }
      const b1 = bIdx(nz);
      let hit = false;
      for(let b=Math.max(0,b1-1); b<=Math.min(NBK-1,b1+1) && !hit; b++) for(let q=RB.start[b]; q<RB.start[b+1]; q++){
        const j = RB.list[q]; if(Rd.dead[j]) continue;
        const dx = Rd.x[j]-nx, dz = Rd.z[j]-nz;
        if(dx*dx+dz*dz < RR[Rd.kind[j]]){
          if(--Rd.hp[j] <= 0) killRed(j); else if(Rd.kind[j]===2) burst(Rd.x[j],.9,Rd.z[j]-.3,0xd9d2c4,3,2.5,.12,.3);
          B.dead[i]=1; hit = true;
          burst((nx+Rd.x[j])/2, .7, (nz+Rd.z[j])/2, Math.random()<.5?0x5d8ef5:0xe0473c, 6, 3.2, .13, .45);
          Snd.clash(); break;
        }
      }
      if(hit) continue;
      if(nz < EZ+.3){ B.dead[i]=1; damageEnemy(1, nx); }
    }
    // kämpar
    for(const c of champs){
      if(c.hp<=0) continue;
      c.ph += dt*8; c.z -= 4.6*dt; if(c.hop>0) c.hop -= dt;
      const b0 = bIdx(c.z);
      for(let b=Math.max(0,b0-1); b<=Math.min(NBK-1,b0+1); b++) for(let q=RB.start[b]; q<RB.start[b+1]; q++){
        const j = RB.list[q]; if(Rd.dead[j] || c.hp<=0) continue;
        const dx = Rd.x[j]-c.x, dz = Rd.z[j]-c.z;
        if(dx*dx+dz*dz < 1.3){ killRed(j); c.hp--; burst(Rd.x[j],.8,Rd.z[j],0xffd24a,8,4,.15,.5); Snd.clash(); game.shake=Math.max(game.shake,.08); }
      }
      if(c.hp<=0){ burst(c.x,1,c.z,0xffd24a,26,5,.2,.8); Snd.boom(); continue; }
      if(gAlive && Math.abs(c.x-giant.x)<1.9 && Math.abs(c.z-giant.z)<1.3){ c.hp = 0; damageBoss(15, c.x, c.z); continue; }
      if(c.z < EZ+.6){
        c.hp = 0; damageEnemy(10, c.x);
        let ba = null; for(const a of archers) if(a.alive && (!ba || Math.abs(a.x-c.x) < Math.abs(ba.x-c.x))) ba = a; if(ba) killArcher(ba);
      }
    }
    champs = champs.filter(c=>c.hp>0);
    updateDragon(dt, frozen);
    updateGiant(dt, frozen);
    updateArchers(dt, frozen);
    updateCannon(dt, frozen);
    updateArrows(dt, frozen);
    updateBurns(dt);
    compact(B); compact(Rd);
  }

  // efterspel: borgar rasar
  if(game.collapse>0){
    game.collapse += dt;
    enemyC.g.position.y = -(Math.min(1, Math.max(0,game.collapse-0.1)/1.6)**2) * 9;
    enemyC.g.rotation.z = Math.sin(game.collapse*30)*.01;
    cannon.position.y = 6.2 + enemyC.g.position.y;
    if(Math.random()<.6) burst(rand(-6,6), rand(1,6), EZ-1+rand(-2,2), Math.random()<.5?0xa69486:0xd8392f, 4, 6, .35, 1.2, 7);
    game.shake = Math.max(game.shake, .25);
  } else cannon.position.y = 6.2;
  if(game.playerBreak>0){
    game.playerBreak += dt;
    playerC.g.position.y = -(Math.min(1, game.playerBreak/1.8)**2) * 5;
    if(Math.random()<.4) burst(rand(-6,6), rand(1,4), PZ+1+rand(-1,1), 0xc2bcae, 3, 5, .35, 1.2, 6);
  }
  if(frozen && !game.sim && Math.random()<.5) burst(rand(-5,5), rand(3,7), rand(EZ,PZ-4), 0xe8f8ff, 1, .5, .1, 1, .2);

  const t = game.T;
  if(!game.sim) for(const f of enemyC.flags.concat(playerC.flags, world.userData.flags)) f.rotation.y = Math.sin(t*3 + f.position.x)*.35;
}

  }

  const ar = redIM.instanceMatrix.array, as = shieldIM.instanceMatrix.array, ac = cavIM.instanceMatrix.array;

  for(let i=0;i<Rd.n;i++){
    const k = Rd.kind[i];
    const hop = Rd.hop[i]>0 ? Math.sin(Rd.hop[i]/Rd.hopD[i]*Math.PI)*Rd.hopH[i] : 0;
    if(k===3){ if(nc<60) setM(ac,nc++,Rd.x[i],Math.abs(Math.sin(t*16+Rd.ph[i]))*.18*fz,Rd.z[i], Math.PI, 1.1); continue; }
    if(k===2){ if(ns<40) setM(as,ns++,Rd.x[i],hop+Math.abs(Math.sin(t*7+Rd.ph[i]))*.05*fz,Rd.z[i], Math.PI, 1.25); continue; }
    const bob = Math.abs(Math.sin(t*11 + Rd.ph[i]))*.1*fz;

  }

  champIM.count = champs.length; champIM.instanceMatrix.needsUpdate = true;
}

const camBase = new THREE.Vector3(), camLook = new THREE.Vector3(0,0,-6), _cp = new THREE.Vector3(), _cl = new THREE.Vector3();
let camIntro = 0;
function fitCamera(){
  const w = innerWidth, h = innerHeight, a = w/h;
  renderer.setSize(w,h,false);
  camera.aspect = a;
  if(a < 1){ camera.fov = 50; camBase.set(0, 31, 35); camLook.set(0,0,-2.2); }
  else { camera.fov = 45; camBase.set(0, 36, 40); camLook.set(0,0,-4); }
  camera.updateProjectionMatrix();
}
function updateCamera(dt){
  game.shake = Math.max(0, game.shake - dt*2.2);
  const s = game.shake*game.shake*1.4;
  let bx = camBase.x, by = camBase.y, bz = camBase.z;
  if(game.mode==='attract' || game.mode==='menu'){ bx += Math.sin(game.T*.25)*4; by += 4; bz += 3; }
  if(camIntro>0){ camIntro = Math.max(0, camIntro - dt*1.4); const k = camIntro*camIntro; by += k*18; bz += k*10; }
  if(game.focusT>0) game.focusT -= dt;
  game.focusK += ((game.focusT>0 ? 1 : 0) - game.focusK) * Math.min(1, dt*3);
  const fk = game.focusK*.62;
  _cp.set(bx, by, bz).lerp(_v.set(game.focus.x, game.focus.y+13, game.focus.z+20), fk);
  _cl.copy(camLook).lerp(game.focus, fk);
  camera.position.set(_cp.x + rand(-s,s), _cp.y + rand(-s,s), _cp.z + rand(-s,s));
  camera.lookAt(_cl);
}

const snapRT = new THREE.WebGLRenderTarget(480, 300);

{ const d = new THREE.DirectionalLight(0xfff0d2, 2.6); d.position.set(-4,8,10); snapScene.add(d); }
const snapCam = new THREE.PerspectiveCamera(32, 1.6, .1, 200);
const LUT = new Uint8Array(256); for(let i=0;i<256;i++){ const c = i/255; LUT[i] = Math.round(255*(c<=.0031308 ? c*12.92 : 1.055*Math.pow(c,1/2.4)-.055)); }
function snapshot(obj, yaw=.5, tilt=.35){
  try{
    obj.rotation.y = yaw; snapScene.add(obj); obj.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
    const r = Math.max(sz.x*.62, sz.y, sz.z*.5);
    snapCam.position.set(c.x, c.y + r*tilt*1.4, c.z + r*2.2); snapCam.lookAt(c);
    const W = 480, H = 300;
    renderer.setRenderTarget(snapRT); renderer.setClearColor(0x000000, 0); renderer.clear();
    renderer.render(snapScene, snapCam);
    const buf = new Uint8Array(W*H*4); renderer.readRenderTargetPixels(snapRT, 0, 0, W, H, buf);
    renderer.setRenderTarget(null);
    snapScene.remove(obj);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d'), img = g.createImageData(W, H);
    for(let y=0;y<H;y++){ const src = (H-1-y)*W*4, dst = y*W*4; for(let x=0;x<W*4;x+=4){ img.data[dst+x]=LUT[buf[src+x]]; img.data[dst+x+1]=LUT[buf[src+x+1]]; img.data[dst+x+2]=LUT[buf[src+x+2]]; img.data[dst+x+3]=buf[src+x+3]; } }
    g.putImageData(img, 0, 0);
    return cv;
  }catch(e){ try{ renderer.setRenderTarget(null); snapScene.remove(obj); }catch(_){} return null; }
}

  storm:{kick:'NY KRAFT', title:'Stormanfall', text:'Slå ut fiender så fylls kraftmätaren. Tryck sedan på blixten: dubbelt så många riddare per skott i några sekunder.'},
  fire:{kick:'NY KRAFT', title:'Brinnande pilar', text:'En salva brinnande pilar mot fienderna där du siktar. Allt i elden brinner. Träffar också bossar och skyttar.'},
  ice:{kick:'NY KRAFT', title:'Is', text:'Fiender, kanon och bossar fryser till is och står still i några sekunder.'},
};
const CARD_ORDER = ['dragon','giant','cannon','archers','cav','shield','brute','storm','fire','ice','pair','mys','gold'];
function levelFeatures(idx){
  const lv = LEVELS[idx], f = new Set();
  if(lv.gates.some(g=>g.pair)) f.add('pair');
  if(lv.gates.some(g=>g.t==='mys')) f.add('mys');
  if(lv.cannon) f.add('cannon'); if(lv.archers) f.add('archers'); if(lv.gold) f.add('gold');
  if(lv.cav) f.add('cav'); if(lv.shield) f.add('shield'); if(lv.brute) f.add('brute');
  if(lv.boss) f.add(lv.boss);
  for(const k of POWS) if(powUnlocked(k)) f.add(k);
  return f;
}
const picCache = {};
function showCard(){
  const k = game.cards[game.cardI], c = CARDS[k];
  save.seen[k] = 1; persist();
  $('cardKick').textContent = c.kick; $('cardKick').className = 'kick' + (c.kick==='BOSS' ? ' boss' : c.kick==='NY KRAFT' ? ' pow' : '');
  $('cardTitle').textContent = c.title; $('cardText').textContent = c.text;
  $('cardCount').textContent = game.cards.length>1 ? `${game.cardI+1} av ${game.cards.length}` : '';
  $('cardOk').textContent = game.cardI < game.cards.length-1 ? 'Nästa' : (game.lv.boss ? 'Möt bossen!' : 'Till strid!');
  const pic = $('cardPic'); pic.innerHTML = '';
  if(UPG[k] && UPG[k].icon){ pic.innerHTML = `<svg viewBox="0 0 24 24" style="color:#fff">${UPG[k].icon}</svg>`; }
  else {
    if(!(k in picCache)){ const o = PICS[k] && PICS[k](); picCache[k] = o ? snapshot(o, k==='dragon'||k==='giant'||k==='cannon' ? .55 : k==='pair'||k==='mys'||k==='gold' ? .15 : .45) : null; }
    if(picCache[k]) pic.appendChild(picCache[k]);
  }
  show('cardScr');
}

/* ================= Skärmar och flöde ================= */
const screens = ['start','levelsScr','pauseScr','resultScr','shopScr','cardScr'];
function show(id){ screens.forEach(s => $(s).hidden = s!==id); }
function coinsUI(){ document.querySelectorAll('.coinN').forEach(e=>e.textContent = save.coins); }
let hintOn = false;
function hideHint(){ hintOn = false; $('hint').hidden = true; }

function toMenu(){
  loadLevel(Math.min(save.unlocked-1, 9), 'attract');
  $('hud').hidden = true; show('start'); coinsUI();
  const n = Math.min(save.unlocked, 10);
  $('playBtn').textContent = save.unlocked>10 || (save.unlocked===10 && save.stars[9]>0) ? 'Spela bana 10' : 'Spela bana ' + n;
  if(save.from==='v1' && !save.migShown){ save.migShown = 1; persist(); setTimeout(()=>banner('Välkommen till v2!', 'Dina stjärnor och mynt följde med'), 600); }
}
function startLevel(idx){
  Snd.init();
  loadLevel(idx, 'play');
  show(null); $('hud').hidden = false;
  hintOn = false; $('hint').hidden = true;
  game.cards = CARD_ORDER.filter(k => levelFeatures(idx).has(k) && !save.seen[k]).slice(0,3); game.cardI = 0;
  if(game.cards.length){ game.mode = 'card'; showCard(); } else beginLevel();
}
function beginLevel(){
  show(null); game.mode = 'play';
  hintOn = game.idx===0 && save.stars[0]===0; $('hint').hidden = !hintOn;
  camIntro = 1;
  const lv = game.lv, idx = game.idx;
  if(lv.boss==='dragon'){ banner('Draken på muren', 'Bana 5 · Boss', true); game.focus.set(0,6,EZ); game.focusT = 1.8; Snd.roar(); }
  else if(lv.boss==='giant'){ banner('Jätten', 'Bana 10 · Slutstriden', true); game.focus.set(0,4,giant.z); game.focusT = 1.8; Snd.roar(); }
  else { banner(`Bana ${idx+1}`, 'Riv borgen'); Snd.horn(); }
}
function starsFor(){ const r = game.php/game.phpMax; return r>=.8?3:r>=.45?2:1; }
function win(){
  if(game.over) return; game.over = true;
  const stars = starsFor(), idx = game.idx, boss = !!game.lv.boss;
  const first = save.stars[idx]===0;
  const coins = Math.round((40 + idx*18 + stars*12 + (boss?70:0)) * (first ? 1 : .5));
  save.coins += coins; save.stars[idx] = Math.max(save.stars[idx], stars);
  if(idx+2 > save.unlocked) save.unlocked = Math.min(10, idx+2);
  persist();
  game.result = {won:true, stars, coins};
  game.nextIdx = Math.min(9, idx+1);
  for(let i=0;i<Rd.n;i++){ Rd.dead[i]=1; burst(Rd.x[i],.6,Rd.z[i],0xe0473c,4,3,.14,.5); }
  for(const a of archers) killArcher(a);
  if(dragon.on){ dragon.dead = .001; dragon.lanes = []; showLanes(false); }
  if(giant.on && giant.alive){ giant.alive = false; giant.dead = .001; if(giant.mark){ giant.mark.visible=false; giant.mark=null; } }
  game.collapse = .001;
  if(game.sim) return;
  Snd.boom();
  if(dragon.on){ slowmo(dragon.x, 5, EZ, 1.6); banner('Draken är besegrad!', '', true); }
  else slowmo(0, 4, EZ-2, 1.4);
  game.resT = 2.9;
}
function lose(){
  if(game.over) return; game.over = true;
  const idx = game.idx;
  const coins = Math.max(5, Math.round((game.dmg/game.ehpMax) * (40 + idx*14)));
  save.coins += coins; persist();
  game.result = {won:false, stars:0, coins};
  game.nextIdx = idx;
  game.playerBreak = .001;
  if(game.sim) return;
  Snd.boom(); game.resT = 2.0;
}
function showResult(won, stars, coins){
  $('hud').hidden = true; show('resultScr');
  const last = game.idx===9 && won, boss = game.lv.boss;
  $('resTitle').textContent = won ? (last ? 'Riket är ditt!' : boss==='dragon' ? 'Draken är besegrad!' : 'Seger!') : 'Borgen föll';
  $('resSub').textContent = won ? (last ? 'Jätten har fallit och alla tio borgar är erövrade.' : `Bana ${game.idx+1} erövrad`)
    : (giant.on && giant.alive && giant.z >= PZ-3.6 ? 'Jätten nådde porten. Tips: krafterna och Kämpar biter på honom.' : giant.on && giant.alive ? `Jätten stod kvar med ${Math.ceil(giant.hp)} HP. Borgen faller först när han är fälld.` : `Du tog ${Math.round(game.dmg/game.ehpMax*100)} % av ${dragon.on?'drakens kraft':'fiendens borg'}. Tips: köp uppgraderingar i Smedjan.`);
  $('resNext').textContent = won ? (last ? 'Spela igen' : 'Nästa bana') : 'Försök igen';
  const st = [...$('resStars').children]; st.forEach(s=>s.classList.remove('on'));
  $('resStars').style.display = won ? '' : 'none';
  st.slice(0,stars).forEach((s,i)=>setTimeout(()=>{ s.classList.add('on'); Snd.star(i); }, 350 + i*300));
  const el = $('resCoins'); let shown = 0; const t0 = performance.now();
  const step = () => { const k = Math.min(1,(performance.now()-t0)/900); const v = Math.round(coins*k); if(v!==shown){ shown=v; el.textContent='+'+v; if(v%5===0) Snd.coin(); } if(k<1) requestAnimationFrame(step); };
  el.textContent = '+0'; setTimeout(step, 300 + stars*300); setTimeout(()=>{ el.textContent = '+'+coins; }, 1500 + stars*300);
}
let shopTab = 'army';
function openShop(){ show('shopScr'); renderShop(); }
function renderShop(){
  coinsUI();
  $('tabArmy').classList.toggle('on', shopTab==='army'); $('tabPow').classList.toggle('on', shopTab==='pow');
  const powNew = POWS.some(k=>powUnlocked(k) && save.upg[k]===0 && save.coins>=UPG[k].cost[0]);
  $('tabPow').innerHTML = 'Krafter' + (powNew && shopTab!=='pow' ? '<i class="dot"></i>' : '');
  const list = $('shopList'); list.innerHTML = '';
  for(const k of shopTab==='army' ? ['rate','pot','champ','hp'] : POWS){
    const u = UPG[k], l = save.upg[k], maxed = l>=u.max, cost = maxed?0:u.cost[l], locked = u.lock && !powUnlocked(k);
    const card = document.createElement('div'); card.className = 'card' + (locked?' locked':'');
    const pips = Array.from({length:u.max},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('');
    const val = locked ? `Låses upp på bana ${u.lock}` : u.lock ? `${u.fmt(u.val(l))}${maxed?'':' → '+u.fmt(u.val(l+1))} · laddar ${dec(POWCD[k](l))} s` : `${u.fmt(u.val(l))}${maxed?'':' → '+u.fmt(u.val(l+1))}`;
    card.innerHTML = `<div class="ic"><svg viewBox="0 0 24 24" style="color:var(--gold)">${u.icon}</svg></div>
      <div class="info"><h3>${u.name}</h3><p>${u.desc}</p><div class="pips">${pips}</div>
      <div class="val">${val}</div></div>
      <button class="buy" ${maxed||locked||save.coins<cost?'disabled':''}>${maxed?'Max':locked?'Låst':`<i class="coin"></i>${cost}`}</button>`;
    list.appendChild(card);
    card.querySelector('.buy').addEventListener('click', ()=>{
      if(maxed || locked || save.coins<cost) return;
      save.coins -= cost; save.upg[k]++; persist(); Snd.coin(); renderShop();
    });
  }
  $('shopPlay').textContent = 'Spela bana ' + (game.nextIdx+1);
}
function renderLevels(){
  const grid = $('levelGrid'); grid.innerHTML = '';
  for(let i=0;i<10;i++){
    const boss = LEVELS[i].boss;
    const b = document.createElement('button'); b.className = 'lvbtn' + (boss?' boss':'') + (i===save.unlocked-1?' cur':''); b.disabled = i>=save.unlocked;
    b.innerHTML = `${i+1}${boss?'<span class="bt">BOSS</span>':''}<span class="st">${[0,1,2].map(k=>`<i class="${k<save.stars[i]?'on':''}"></i>`).join('')}</span>`;
    b.setAttribute('aria-label','Bana '+(i+1)+(boss?', boss':''));
    b.addEventListener('click', ()=>{ Snd.init(); Snd.click(); startLevel(i); });
    grid.appendChild(b);
  }
}
function pause(){ if(game.mode!=='play' || game.over) return; game.mode='pause'; game.firing=false; show('pauseScr'); }

/* ---------- knappar ---------- */
const on = (id, fn) => $(id).addEventListener('click', e => { Snd.init(); Snd.click(); fn(e); });
on('playBtn', ()=> startLevel(Math.min(save.unlocked-1, 9)));
on('levelsBtn', ()=>{ renderLevels(); show('levelsScr'); });
on('levelsBack', ()=> show('start'));
on('shopBtn1', ()=>{ game.nextIdx = Math.min(save.unlocked-1,9); openShop(); });
on('shopBack', ()=>{ if(game.mode==='after') show('resultScr'); else toMenu(); });
on('shopPlay', ()=> startLevel(game.nextIdx));
on('tabArmy', ()=>{ shopTab='army'; renderShop(); });
on('tabPow', ()=>{ shopTab='pow'; renderShop(); });
on('pauseBtn', pause);
on('resumeBtn', ()=>{ game.mode='play'; show(null); });
on('restartBtn', ()=> startLevel(game.idx));
on('quitBtn', toMenu);
on('resNext', ()=> startLevel(game.nextIdx));
on('resShop', openShop);
on('resMenu', toMenu);
on('cardOk', ()=>{ game.cardI++; if(game.cardI < game.cards.length) showCard(); else beginLevel(); });
document.querySelectorAll('.sndbtn').forEach(b => b.addEventListener('click', ()=>{ setMute(!save.mute); Snd.click(); }));
document.querySelectorAll('.musbtn').forEach(b => b.addEventListener('click', ()=>{ Snd.init(); setMusic(!save.music); Snd.click(); }));
ui.champ.addEventListener('click', ()=>{ Snd.init(); sendChamp(); });
for(const k of POWS) ui.pw[k].addEventListener('click', ()=>{ Snd.init(); if(!usePower(k)) Snd.bad(); });

/* ---------- styrning ---------- */
const _ray = new THREE.Raycaster(), _ndc = new THREE.Vector2(), _plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0), _hit = new THREE.Vector3();
function pointerToX(clientX, clientY){
  _ndc.set(clientX/innerWidth*2-1, -(clientY/innerHeight)*2+1);
  _ray.setFromCamera(_ndc, camera);
  if(!_ray.ray.intersectPlane(_plane, _hit)) return game.targetX;
  return clamp(_hit.x, -XL, XL);
}
let activePointer = null;
canvas.addEventListener('pointerdown', e => {
  if(game.mode!=='play' || game.over) return;
  Snd.init();
  activePointer = e.pointerId; try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  game.firing = true; game.targetX = pointerToX(e.clientX, e.clientY);
  if(game.fireT > .05) game.fireT = .05;
  if(hintOn) hideHint();
});
canvas.addEventListener('pointermove', e => { if(e.pointerId===activePointer && game.mode==='play') game.targetX = pointerToX(e.clientX, e.clientY); });
const endP = e => { if(e.pointerId===activePointer){ activePointer=null; game.firing=false; } };
canvas.addEventListener('pointerup', endP); canvas.addEventListener('pointercancel', endP);
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if(e.key===' ') sendChamp(); if(e.key==='Escape') pause();
  const pk = {'1':'storm','2':'fire','3':'ice'}[e.key]; if(pk) usePower(pk);
});
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) pause(); });
window.addEventListener('resize', fitCamera);

/* ================= Huvudloop ================= */
const fpsEl = $('fps'); let showFps = location.hash==='#fps'; fpsEl.hidden = !showFps;
let last = performance.now(), fAcc = 0, fN = 0, slowAcc = 0, slowN = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now;
  if(dt > .05) dt = .05;
  let ts = 1; if(game.slowT>0){ game.slowT -= dt; ts = .28; }
  const sdt = dt*ts;
  if(game.mode !== 'pause' && game.mode !== 'card') update(sdt);
  if(game.resT>0){ game.resT -= dt; if(game.resT<=0 && game.result){ game.mode='after'; if(game.result.won) Snd.win(); else Snd.lose(); showResult(game.result.won, game.result.stars, game.result.coins); } }
  drawUnits();
  updateParticles(game.mode==='pause'||game.mode==='card'?0:sdt);
  updateShocks(game.mode==='pause'||game.mode==='card'?0:sdt);
  updateFloats(dt);
  updateCamera(dt);
  if(game.mode==='play') hudPow(false);
  try{ Music.tick(); }catch(e){}
  renderer.render(scene, camera);
  const army = B.n + champs.length;
  if(army !== lastArmy){ lastArmy = army; ui.army.textContent = army; }
  fAcc += dt; fN++;
  if(fAcc >= .5){ const fps = fN/fAcc; if(showFps) fpsEl.textContent = `${fps.toFixed(0)} fps · ${B.n+Rd.n} enheter · dpr ${pixelRatio}`; window.__fps = fps; fAcc = 0; fN = 0;
    if(game.mode==='play'){ slowAcc += fps; slowN++; if(slowN>=4){ const avg = slowAcc/slowN; slowAcc=0; slowN=0; if(avg<45 && pixelRatio>1.25){ pixelRatio = Math.max(1.25, pixelRatio-.25); renderer.setPixelRatio(pixelRatio); fitCamera(); } } }
  }
}

/* ---------- testkrokar och balanssimulering ---------- */
function simLevel(idx, maxT=360, dt=1/30, skill=game.botSkill){
  game.sim = true;
  loadLevel(idx, 'play'); game.bot = true; game.botSkill = skill; game.stat = {clone:0, add:0, combo:0, shot:0, peak:0, lost:0};
  let t = 0;
  while(!game.result && t < maxT){ update(dt); t += dt; if(B.n>game.stat.peak) game.stat.peak = B.n; }
  const r = game.result || {won:false, stars:0, coins:0, timeout:true};
  const out = {...r, stat:game.stat, t:+t.toFixed(1), ehp:Math.max(0,Math.round(game.ehp)), php:game.php, giant:giant.on ? Math.max(0,Math.round(giant.hp)) : undefined, giantZ:giant.on ? +giant.z.toFixed(1) : undefined};
  game.sim = false; game.bot = false;
  return out;
}
function buyAll(order=['pot','rate','hp','champ','storm','fire','ice']){
  let bought = true;
  while(bought){
    bought = false; let bk = null, bc = 1e9;
    for(const k of order){ const u = UPG[k], l = save.upg[k]; if(l>=u.max || (u.lock && !powUnlocked(k))) continue; if(u.cost[l] < bc){ bc = u.cost[l]; bk = k; } }
    if(bk && save.coins >= bc){ save.coins -= bc; save.upg[bk]++; bought = true; }
  }
}
function campaign({retries=6, buy=true, start=null, skill=.5}={}){
  game.botSkill = skill;
  const real = save; noPersist = true; save = start ? normalize(JSON.parse(JSON.stringify(start))) : freshSave(); save.seen = Object.fromEntries(CARD_ORDER.map(k=>[k,1]));
  const log = [];
  try{
    for(let i=0;i<10;i++){
      let tries = 0, r;
      do{ tries++; r = simLevel(i); if(!r.won && buy) buyAll(); } while(!r.won && tries < retries);
      log.push({lv:i+1, tries, won:r.won, t:r.t, stars:r.stars, php:r.php, ehp:r.ehp, giant:r.giant, giantZ:r.giantZ, upg:Object.values(save.upg).join(''), coins:save.coins});
      if(buy) buyAll();
      if(!r.won) break;
    }
  } finally { save = real; noPersist = false; game.sim = false; toMenu(); }
  return log;
}
window.__rp = { TUNE, game, B, Rd, save:()=>save, startLevel, sendChamp, ui, gates:()=>gates, dragon, giant, usePower, simLevel, campaign, buyAll, LEVELS, UPG,
  step(n=60, dt=1/60, render=false){ let ms=0; for(let k=0;k<n;k++){ const t0=performance.now(); if(game.mode!=='pause' && game.mode!=='card') update(dt); drawUnits(); updateParticles(dt); updateShocks(dt); updateFloats(dt); updateCamera(dt); if(render) renderer.render(scene,camera); ms+=performance.now()-t0; } return {msPerFrame:+(ms/n).toFixed(2), mode:game.mode, ehp:game.ehp, php:game.php, b:B.n, r:Rd.n}; },
  aim(x, fire=true){ game.targetX=x; game.firing=fire; if(hintOn) hideHint(); }, bot(on=true){ game.bot = on; },
  cards(){ return game.cards; }, okCard(){ $('cardOk').click(); },
  spawn(nb, nr){ for(let i=0;i<nb;i++) addUnit(B, rand(-XL,XL), rand(-20,15)); for(let i=0;i<nr;i++){ const j=addUnit(Rd, rand(-XL,XL), rand(-25,10)); if(j>=0) Rd.sp[j]=game.lv.rs; } }, fps:()=>window.__fps, showFps(){ showFps=true; fpsEl.hidden=false; } };

fitCamera();
setMute(save.mute);
setMusic(save.music);
toMenu();
requestAnimationFrame(t => { last = t; frame(t); });
if(document.fonts && document.fonts.load){ document.fonts.load('150px "Lilita One"').then(redrawLabels).catch(()=>{}); }
</script>
